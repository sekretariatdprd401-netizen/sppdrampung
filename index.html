        const missing = required.filter(([id]) => !$('#' + id).value.trim());
        if (missing.length) {
          const pejabatIds = ['fTtdSpt', 'fTtdSpd', 'fPptk'];
          const missingPejabat = missing.filter(([id]) => pejabatIds.indexOf(id) > -1);
          const tanpaDataPejabat = missingPejabat.length === missing.length && missingPejabat.some(([id]) => {
            const el = $('#' + id);
            return el && ![...el.options].some(o => String(o.value).trim());
          });
          if (tanpaDataPejabat) {
            toast('error', 'Data Pejabat belum ada',
              'Tambahkan pejabat penandatangan lebih dulu di menu Pengaturan → Pejabat Penandatanganan ' +
              '(peran: Penandatangan SPT / Penandatangan SPD / PPTK).');
            return;
          }
          toast('error', 'Data belum lengkap', missing.map(([, l]) => l).join(', '));
          const first = $('#' + missing[0][0]); if (first) first.focus();
          return;
        }
        if (pelaksanaState.length === 0) {
          toast('error', 'Pelaksana belum diisi', 'Tambahkan minimal satu pelaksana.');
          return;
        }
        const obj = {
          id: data ? data.id : null,
          noSpt: $('#fNoSpt').value.trim(),
          noSppd: $('#fNoSppd').value.trim(),
          jenisSuratTugas: $('#fJenisTugas').value,
          tglSppd: $('#fTglSppd').value,
          program: '', kegiatan: '',
          subkegiatan: '', rekening: '',
          maksud: $('#fMaksud').value.trim(),
          kotaTujuan: $('#fKotaTujuan').value.trim(),
          transport: $('#fTransport').value,
          tglBerangkat: $('#fTglBerangkat').value,
          tglKembali: $('#fTglKembali').value,
          lamaHari: Number($('#fLamaHari').value) || 1,
          ttdSpt: $('#fTtdSpt').value, ttdSpd: $('#fTtdSpd').value, pptk: $('#fPptk').value,
          pelaksana: pelaksanaState,
          biaya: (data && data.biaya) || { uangHarian: 0, representasi: 0, transport: 0, taksi: 0, penginapan: 0, sewaKendaraan: 0, lainnya: 0, ppn: 0, pph: 0 },
          dokumen: (data && data.dokumen) || { spt: null, sppd: null, tiket: null, boarding: null, hotel: null, pendukung: null }
        };
        const btnLabel = btnSave.innerHTML;
        btnSave.disabled = true; btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
        try {
          if (data) await updateSPPD(obj); else await saveSPPD(obj);
          toast('success', data ? 'Data diperbarui' : 'Data disimpan', 'SPPD ' + obj.noSppd + ' ' + (data ? 'berhasil diperbarui' : 'berhasil disimpan'));
          closeModal('modalSPPD');
          refreshCurrentView_();
        } catch (e) {
          toast('error', 'Gagal menyimpan', e.message);
        } finally {
          btnSave.disabled = false; btnSave.innerHTML = btnLabel;
        }
      });
    }

    function terbilang(n) {
      const satuan = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
      n = Math.abs(Math.round(Number(n) || 0));
      if (n < 12) return satuan[n] || '';
      if (n < 20) return satuan[n-10] + ' belas';
      if (n < 100) return satuan[Math.floor(n/10)] + ' puluh' + (n%10 ? ' ' + satuan[n%10] : '');
      if (n < 200) return 'seratus' + (n%100 ? ' ' + terbilang(n%100) : '');
      if (n < 1000) return satuan[Math.floor(n/100)] + ' ratus' + (n%100 ? ' ' + terbilang(n%100) : '');
      return String(n);
    }

    function printIdentityConfig(r, forSpt) {
      const inst = DB.instansi || {};

      if (forSpt && r) {
        const jenis = String(r.jenisSuratTugas || '').trim();
        const kopMatch = jenis ? findKopByJenis(jenis) : null;
        if (jenis && !kopMatch) {
          toast('warning', 'Kop belum dikonfigurasi', 'Kop untuk Jenis Surat Tugas "' + jenis + '" belum dikonfigurasi pada Pengaturan Kop. Menggunakan kop default.');
        }
        m = kopMatch || {};
      }
      const src = Object.keys(m).length ? m : defaultKop;
      return {
        namaInstansi: src.namaInstansi || inst.nama || defaultKop.namaInstansi || 'Nama Instansi',
        namaUnitKerja: src.namaUnitKerja || inst.organisasi || defaultKop.namaUnitKerja || '',
        alamat: src.alamat || inst.alamat || defaultKop.alamat || '',
        telp: (src.telepon && src.telepon !== '-' ? src.telepon : '') || inst.telepon || defaultKop.telepon || '',
        laman: (src.laman && src.laman !== '-' ? src.laman : '') || inst.laman || defaultKop.laman || '',
        kota: src.kota || inst.kabkota || '',
        tahun: new Date().getFullYear(),
        logoBase64: logoSrc_(false) || src.logo || '',
        dasarHukum: (DB.dasarHukum || []).map(x => x.dasarHukum).filter(Boolean).join('\n')
      };
    }

    function resolvedDocIdentity(r, forSpt) {
      const inst = DB.instansi || {};
      const defaultKop = getDefaultKop() || (DB.kop && DB.kop[0]) || {};
      let m = {};
      if (forSpt && r) {
        const jenis = String(r.jenisSuratTugas || '').trim();
        m = (jenis ? findKopByJenis(jenis) : null) || {};
      }
      const src = Object.keys(m).length ? m : defaultKop;
      return {
        nama: src.namaInstansi || inst.nama || '',
        unit: src.namaUnitKerja || inst.organisasi || '',
        alamat: src.alamat || inst.alamat || '',
        kota: src.kota || inst.kabkota || ''
      };
    }

    function findPejabatByNama(nama, peran) {
      const list = DB.pejabat || [];
      const n = String(nama || '').trim().toLowerCase();
      const byNama = list.find(p => p.status === 'Aktif' && String(p.nama || '').trim().toLowerCase() === n);
      if (byNama) return byNama;
      if (peran) return list.find(p => p.status === 'Aktif' && (p.peran || []).includes(peran));
      return null;
    }

    function docTitleCase(str) {

      return String(str).toLowerCase().replace(/(^|\s)\w/g, l => l.toUpperCase());

    function docTglRentang(tglPergi, tglPulang, lamanya) {
      const bulanNama = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      if (!tglPergi || !tglPulang) return null;
      const d1 = new Date(String(tglPergi).length === 10 ? tglPergi + 'T00:00:00' : tglPergi);
      const d2 = new Date(String(tglPulang).length === 10 ? tglPulang + 'T00:00:00' : tglPulang);
      if (isNaN(d1) || isNaN(d2)) return null;
      const hari = Number(lamanya) || Math.round((d2 - d1) / 86400000) + 1;
      const lamaStr = hari + ' (' + terbilang(hari) + ') hari';
      let tglStr = '';
      if (hari === 1) tglStr = 'tanggal ' + d1.getDate() + ' ' + bulanNama[d1.getMonth()] + ' ' + d1.getFullYear();
      else if (d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear()) tglStr = 'dari tanggal ' + d1.getDate() + ' s/d ' + d2.getDate() + ' ' + bulanNama[d1.getMonth()] + ' ' + d1.getFullYear();
      else tglStr = 'dari tanggal ' + d1.getDate() + ' ' + bulanNama[d1.getMonth()] + ' s/d ' + d2.getDate() + ' ' + bulanNama[d2.getMonth()] + ' ' + d2.getFullYear();
      return { hari, lamaStr, tglStr };
    }

    function tujuanPreposisi(tujuan) {
      const dt = String(tujuan || '').trim().toLowerCase();
      if (!dt) return 'ke';
      if (/^(di|ke|dari|pada)\s/.test(dt)) return '';
      if (/(^|[^a-zà-ÿ])(hotel|resort|convention|conference|ballroom|aula|gedung|venue|wisma|losmen|homestay|villa|cottage|motel|penginapan|resto|restoran|caf[eé]|kafe|mall|plaza|stadi(?:on|um)|arena|auditorium|hall)(?![a-zà-ÿ])/.test(dt)) return 'di';
      return 'ke';
    }

    function docUntukExtra(tujuan, tglPergi, tglPulang, lamanya) {
      if (!tujuan || !tglPergi || !tglPulang || !lamanya) return '';
      const preposisi = tujuanPreposisi(tujuan);
      const rg = docTglRentang(tglPergi, tglPulang, lamanya);
      return (preposisi ? ' ' + preposisi : '') + ' ' + escapeHtml(String(tujuan).trim()) + ' selama ' + rg.lamaStr + ', ' + rg.tglStr;
    }

    function sptUntukRaw(r) {
      const d = r || {};
      return String(d.maksud || '').trim() + docUntukExtra(d.kotaTujuan, d.tglBerangkat, d.tglKembali, d.lamaHari);
    }

    function docKop(c, logoPx, opt) {
      opt = opt || {};
      const px = logoPx || 82;
      const logo = c.logoBase64
        ? '<img src="' + c.logoBase64 + '" style="width:' + px + 'px;height:' + px + 'px;object-fit:contain;" />'
        : '<div style="width:' + px + 'px;height:' + px + 'px;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;">LOGO</div>';
      const f1 = opt.f1 || '14pt';
      const f2 = opt.f2 || '14pt';
      const fs = opt.fs || '9pt';
      let html = '<table><tr><td style="width:' + px + 'px;text-align:center">' + logo + '</td><td style="text-align:center">' +
        '<div style="font-size:' + f1 + ';font-weight:bold;letter-spacing:1.5pt;text-transform:uppercase">' + escapeHtml(c.namaInstansi) + '</div>' +
        '<div style="font-size:' + f2 + ';font-weight:bold;letter-spacing:1pt;text-transform:uppercase;white-space:nowrap;">' + escapeHtml(c.namaUnitKerja) + '</div>';

    function validatePrintSPPD(r, mode) {
      const missing = [];
      const rules = [['noSpt', 'Nomor SPT'], ['noSppd', 'Nomor SPPD'], ['kotaTujuan', 'Daerah/Tempat Tujuan'], ['maksud', 'Maksud Perjalanan'], ['tglBerangkat', 'Tanggal Pergi'], ['tglKembali', 'Tanggal Pulang']];
      rules.forEach(([k, l]) => { if (!r[k] || !String(r[k]).trim()) missing.push(l); });
      const idn = resolvedDocIdentity(r, true);
      const idnKurang = [];
      if (!idn.nama) idnKurang.push('nama instansi');
      if (!idn.unit) idnKurang.push('nama unit kerja');
      if (!idn.alamat) idnKurang.push('alamat');
      if (!idn.kota) idnKurang.push('kota');
      if (idnKurang.length) {
        missing.push('Identitas dokumen (' + idnKurang.join(', ') + ') — lengkapi di menu Pengaturan → Pengaturan Kop');
      }
      const jenis = String(r.jenisSuratTugas || '').trim();
      if (jenis && !findKopByJenis(jenis)) {
        toast('error', 'Kop belum dikonfigurasi', 'Kop untuk Jenis Surat Tugas "' + jenis + '" belum dikonfigurasi pada Pengaturan Kop. Silakan tambahkan pada menu Pengaturan → Pengaturan Kop.');
        return false;
      }
      const pel = r.pelaksana || [];
      if (!pel.length) missing.push('Pelaksana');
      if (mode !== 'perorang' && pel.length && pel.some(p => !p.nama || !String(p.nama).trim() || !p.nip || !String(p.nip).trim() || !p.jabatan || !String(p.jabatan).trim())) missing.push('Data pegawai (nama/NIP/jabatan) belum lengkap');
      if (missing.length) {
        toast('error', 'Data belum lengkap', 'Silakan lengkapi data sebelum mencetak dokumen: ' + missing.join(', '));
        return false;
      }
      return true;
    }
    function validatePelaksana(p) {
      const missing = [];
      if (!p.nama || !String(p.nama).trim()) missing.push('Nama Pegawai');
      if (!p.nip || !String(p.nip).trim()) missing.push('NIP');
      if (!p.jabatan || !String(p.jabatan).trim()) missing.push('Jabatan');
      if (missing.length) {
        toast('error', 'Data pegawai belum lengkap', 'Silakan lengkapi data pegawai sebelum mencetak dokumen: ' + missing.join(', '));
        return false;
      }
      return true;
    }

    async function pickPelaksana(r, title) {
      const pel = r.pelaksana || [];
      if (!pel.length) {
        toast('error', 'Belum ada pelaksana', 'Silakan tambahan minimal satu pegawai pada SPPD sebelum mencetak dokumen.');
        return null;
      }
      if (pel.length === 1) return pel[0];
      const labels = pel.map(p => (p.nama || 'Tanpa Nama') + (p.nip ? ' - ' + p.nip : ''));
      const res = await Swal.fire({
        title,
        icon: 'question',
        input: 'select',
        inputOptions: labels,
        inputPlaceholder: 'Pilih pegawai...',
        showCancelButton: true,
        confirmButtonText: '<i class="fas fa-print"></i> Cetak',
        cancelButtonText: 'Batal',
        inputValidator: v => (v === undefined || v === '') ? 'Silakan pilih pegawai terlebih dahulu.' : null
      });
      if (!res.isConfirmed) return null;
      let idx = Number(res.value);
      if (!(idx > -1 && idx < pel.length)) idx = labels.findIndex(l => l === res.value);
      return (idx > -1 && idx < pel.length ? pel[idx] : null);
    }

    function rmpNumDot(n) {
      n = Number(n) || 0;
      return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }
    function rmpTbl(n) {
      if (!n) return "";
      n = Math.floor(Math.abs(n));
      const h = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];
      if (n < 12) return h[n];
      if (n < 20) return rmpTbl(n - 10) + " Belas";
      if (n < 100) return rmpTbl(Math.floor(n / 10)) + " Puluh " + rmpTbl(n % 10);
      if (n < 200) return "Seratus " + rmpTbl(n - 100);
      if (n < 1000) return rmpTbl(Math.floor(n / 100)) + " Ratus " + rmpTbl(n % 100);
      if (n < 2000) return "Seribu " + rmpTbl(n - 1000);
      if (n < 1000000) return rmpTbl(Math.floor(n / 1000)) + " Ribu " + rmpTbl(n % 1000);
      if (n < 1000000000) return rmpTbl(Math.floor(n / 1000000)) + " Juta " + rmpTbl(n % 1000000);
      return rmpTbl(Math.floor(n / 1000000000)) + " Miliar " + rmpTbl(n % 1000000000);
    }

      const m = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();

      k = k || {};
      const list = DB.program || [];
      let prg = k.subkegiatanId ? list.find(p => p.id === k.subkegiatanId) : null;
      if (!prg && k.kegiatan) prg = list.find(p => (p.kegiatan || '') === String(k.kegiatan).trim());
      const dariMaster = prg ? progKodeKegiatan(prg) : '';
      if (dariMaster) return dariMaster;
      const tersimpan = String(k.kodeKegiatan || '').trim();
      if (!tersimpan) return '';
      const kodeProgramRef = [
        String(k.kodeProgram || '').trim(),
        prg ? progKodeProgram(prg) : '',
        prg ? String(prg.kode || '').trim() : ''
      ];
      if (kodeProgramRef.some(c => c && c === tersimpan)) return '';
      return tersimpan;
    }

        else if (type === 'number') safe = 11;
        else if (type === 'short') safe = 6;
        if (len > safe) t = basePt * (safe / len);
        return Math.max(4.5, Math.min(basePt, t)) + 'pt';

    const RMP_REKAP_CATEGORIES = ['Uang Harian', 'Biaya Trasportasi', 'Biaya Penginapan', 'Uang Representasi', 'Biaya Taxi', 'Biaya Kontribusi'];
    function rmpRekapCategoryKey(desc) {
      const d = (desc || '').trim().toLowerCase();
      if (!d) return null;
      if (d.includes('uang harian') || d.includes('diklat')) return 'Uang Harian';
      if (d.includes('penginapan') || d.includes('hotel')) return 'Biaya Penginapan';
      if (d.includes('refresentasi') || d.includes('representasi')) return 'Uang Representasi';
      if (d.includes('taksi') || d.includes('taxi')) return 'Biaya Taxi';
      if (d.includes('kontribusi')) return 'Biaya Kontribusi';
      if (d.includes('tiket') || d.includes('transport') || d.includes('pesawat') || d.includes('travel') || d.includes('boat') || d.includes('kapal') || d.includes('kereta') || d.includes('transportasi')) return 'Biaya Trasportasi';
      return 'Biaya Trasportasi';
    }
    async function printRampungRekap(id) {
      const r = (await getRampung()).find(x => x.id === id);
      if (!r) { toast('error', 'Data tidak ditemukan'); return; }
      const rp = rmpRejectEmpty(r);
      if (!rp) return;

      const k = r.kegiatan || {};
      const keperluan = k.keperluan || '';
      const kodeRek = k.rekening || '';
      const pa = rmpPejabat((r.pejabat || {}).pa);
      const bend = rmpPejabat((r.pejabat || {}).bendahara);

      const rows = rp.map((peg, idx) => {
        const byDesc = {};
        let totalPeg = 0;
        peg.items.forEach(it => {
          const ck = rmpRekapCategoryKey(it.desc);
          const sub = rmpItemSubtotal(it);
          if (ck) byDesc[ck] = (byDesc[ck] || 0) + sub;
          totalPeg += sub;
        });
        return { no: idx + 1, nama: peg.nama || '', nip: peg.nip || '', byDesc, totalPeg };
      });

      const colTotals = {};
      RMP_REKAP_CATEGORIES.forEach(d => { colTotals[d] = 0; });
      let grandTotal = 0;
      rows.forEach(rr => {
        RMP_REKAP_CATEGORIES.forEach(d => { colTotals[d] += rr.byDesc[d] || 0; });
        grandTotal += rr.totalPeg;
      });
      const allDescs = RMP_REKAP_CATEGORIES.filter(d => (colTotals[d] || 0) > 0);
      if (!allDescs.length) { toast('error', 'Data Kosong', 'Tidak ada item perincian biaya ditemukan.'); return; }

      const totalCols = 2 + allDescs.length + 2;
      let basePt = 9;
      if (totalCols <= 5) basePt = 10;
      else if (totalCols <= 8) basePt = 9;
      else if (totalCols <= 12) basePt = 8;
      else basePt = 7;

      const estNameWeight = () => {
        let w = 4;
        rows.forEach(rr => { w = Math.max(w, String(rr.nama || '').length); if (rr.nip) w = Math.max(w, String(rr.nip).length); });
        return w;
      };
      const estHeaderWeight = text => {
        const s = String(text || '').trim();
        if (!s) return 6;
        const words = s.split(/\s+/);
        const longest = words.reduce((m, wd) => Math.max(m, wd.length), 0);
        return Math.max(longest, Math.min(Math.ceil(s.length * 0.55), 16), 6);
      };
      const estNumWeight = values => {
        let maxLen = 5;
        (values || []).forEach(v => {
          const s = (typeof v === 'string') ? v : ((v > 0) ? rmpNumDot(v) : '-');
          maxLen = Math.max(maxLen, Math.ceil(String(s).length * 0.7));
        });
        return maxLen;
      };
      let uniformBiayaWeight = 5;
      allDescs.forEach(d => {
        const numVals = rows.map(rr => rr.byDesc[d] || 0);
        if ((colTotals[d] || 0) > 0) numVals.push(colTotals[d]);
        const w = Math.max(estHeaderWeight(d), estNumWeight(numVals), 5);
        if (String(d).trim().toLowerCase() === 'biaya penginapan') uniformBiayaWeight = w;
      });

      const weights = [];
      weights.push(estNumWeight(rows.map(rr => rr.no).concat(['NO'])));
      weights.push(estNameWeight());
      allDescs.forEach(() => weights.push(uniformBiayaWeight));
      weights.push(uniformBiayaWeight);
      weights.push(Math.max(estHeaderWeight('TANDA TANGAN'), 13));
      const clampW = (w, total, minPct, maxPct) => {
        const pct = w / total;
        if (pct < minPct) return total * minPct;
        if (pct > maxPct) return total * maxPct;
        return w;
      };
      let wTotal = weights.reduce((a, b) => a + b, 0);
      if (wTotal <= 0) wTotal = 1;
      weights[0] = clampW(weights[0], wTotal, 0.02, 0.05);
      weights[1] = clampW(weights[1], wTotal, 0.08, 0.42);
      wTotal = weights.reduce((a, b) => a + b, 0) || 1;
      weights[weights.length - 1] = clampW(weights[weights.length - 1], wTotal, 0.10, 0.18);
      for (let i = 2; i < weights.length - 1; i++) weights[i] = uniformBiayaWeight;
      const wSum = weights.reduce((a, b) => a + b, 0) || 1;
      const colgroup = '<colgroup>' + weights.map(w => '<col style="width:' + ((w / wSum) * 100).toFixed(4) + '%">').join('') + '</colgroup>';

      let thead = '<thead><tr><th class="col-no">NO</th><th class="col-nama">NAMA</th>';
      allDescs.forEach(d => { thead += '<th class="col-biaya" style="font-size:' + basePt + 'pt">' + escapeHtml(d) + '</th>'; });
      thead += '<th class="col-amount col-biaya">JUMLAH</th><th class="col-sign">TANDA TANGAN</th></tr></thead>';

      let tbody = '<tbody>';
      const trStyle = rows.length <= 5 ? ' style="height:55px"' : '';
      rows.forEach(rr => {
        tbody += '<tr' + trStyle + '>' +
          '<td class="text-center col-no">' + rr.no + '</td>' +
          '<td class="col-nama"><b>' + escapeHtml(rr.nama) + '</b>' + (rr.nip ? '<br><small>' + escapeHtml(rr.nip) + '</small>' : '') + '</td>';
        allDescs.forEach(d => {
          const val = rr.byDesc[d] || 0;
          tbody += '<td class="text-right col-amount col-biaya">' + (val > 0 ? rmpNumDot(val) : '-') + '</td>';
        });
        tbody += '<td class="text-right col-amount col-biaya" style="font-weight:bold">' + rmpNumDot(rr.totalPeg) + '</td><td class="col-sign">&nbsp;</td></tr>';
      });
      tbody += '</tbody>';

      let tfoot = '<tfoot><tr><th class="text-right col-amount" colspan="2" style="white-space:nowrap">TOTAL KESELURUHAN</th>';
      allDescs.forEach(d => { tfoot += '<th class="text-right col-amount col-biaya">' + (colTotals[d] > 0 ? rmpNumDot(colTotals[d]) : '-') + '</th>'; });
      tfoot += '<th class="text-right col-amount col-biaya">' + rmpNumDot(grandTotal) + '</th><th class="col-sign"></th></tr></tfoot>';

      const rekapTitle = (colTotals['Biaya Kontribusi'] || 0) > 0 ? 'REKAPITULASI BIAYA KONTRIBUSI' : 'REKAPITULASI BIAYA PERJALANAN DINAS';
      const ttdHtml = '<table class="signature-area" style="width:100%;margin-top:25px">' +
        '<tr>' +
        '<td style="width:50%;text-align:center">Mengetahui/Menyetujui,<br>Pengguna Anggaran<br>' + escapeHtml(rmpUnitKerja(pa)) + '<br>&nbsp;<br><br><br><br>' +
        '<span class="sign-name" style="white-space:nowrap">' + escapeHtml(pa.nama || '............................') + '</span><br>' +
        'NIP. ' + escapeHtml(pa.nip || '............................') + '</td>' +
        '<td style="width:50%;text-align:center"><br>Lunas dibayar<br>Bendahara Pengeluaran<br>&nbsp;<br><br><br><br>' +
        '<span class="sign-name" style="white-space:nowrap">' + escapeHtml(bend.nama || '............................') + '</span><br>' +
        'NIP. ' + escapeHtml(bend.nip || '............................') + '</td>' +
        '</tr></table>';

      const docHtml = '<style>@page{size:auto;margin:10mm 15mm 5mm 15mm}' + RMP_CSS_REKAP + '</style>' +
        rmpKopSurat() +
        '<div class="rekap-title">' + rekapTitle + '</div>' +
        '<div class="rekap-subtitle">"' + escapeHtml(keperluan) + '"</div>' +
        (kodeRek ? '<div class="rekap-spacer-kode">&nbsp;</div><div class="rekap-kode-rek">KODE REKENING : ' + escapeHtml(kodeRek) + '</div>' : '') +
        '<div class="rekap-table-wrap"><table class="table-rekap" style="font-size:' + basePt + 'pt">' + colgroup + thead + tbody + tfoot + '</table></div>' +
        ttdHtml;
      doPrint(docHtml, 'REKAP_' + String(r.noSppd || '').replace(/\//g, '_'), (area) => {
        const wrap = area.querySelector('.rekap-table-wrap');
        const table = wrap ? wrap.querySelector('.table-rekap') : null;
        if (wrap && table) {
          table.style.width = '100%';
          table.style.tableLayout = 'fixed';
          const availW = wrap.clientWidth || document.documentElement.clientWidth || window.innerWidth;
          const contentW = table.scrollWidth;
          if (contentW > availW) {
            const scale = availW / contentW;
            wrap.style.transformOrigin = 'top left';
            wrap.style.transform = 'scale(' + scale + ')';
            wrap.style.width = (100 / scale) + '%';
          }
        }
      });
    }

    const REF_PREFETCH_MAP_ = [
      { key: 'instansi', action: 'getInstansi' },
      { key: 'cetakConfig', action: 'getCetakConfig' },
      { key: 'kop', action: 'getKop' },
      { key: 'pejabat', action: 'getPejabat' },
      { key: 'dasarHukum', action: 'getDasarHukum' }
    ];

    async function prefetchReferenceData_() {
      if (!gasAvailable()) return false;
      try {
        await ensureDataVersion_();
        const perlu = REF_PREFETCH_MAP_.filter(r => dataCacheGet_(r.key) === undefined);
        if (!perlu.length) return true;
        const session = currentSession();
        const token = (session && session.token) || '';
        const env = await gasRequestBatch_(
          perlu.map(r => ({ action: r.action, args: [token] }))
        );
        env.forEach((e, i) => {
          if (!e || e.success !== true) return;
          const key = perlu[i].key;
          const data = e.data;
          if (key === 'instansi') {
            if (data && typeof data === 'object') { DB.instansi = data; dataCacheSet_('instansi', data); }
          } else if (key === 'cetakConfig') {
            if (data && typeof data === 'object') { DB.cetakConfig = data; dataCacheSet_('cetakConfig', data); }
          } else if (Array.isArray(data)) {
            DB[key] = data;
            dataCacheSet_(key, data);
          }
        });
        saveDB();
        return true;
      } catch (e) {
        return false;
      }
    }

    function buildRampungFromSPPD(s) {
      const pel = (s.pelaksana && s.pelaksana[0]) || {};
      const now = s.tglBerangkat || '';
      let prog = null;
      if (s.kegiatan && s.kegiatan.subkegiatanId) prog = (DB.program || []).find(p => p.id === s.kegiatan.subkegiatanId);
      if (!prog && s.kegiatan && s.kegiatan.subkegiatan) { const nm = String(s.kegiatan.subkegiatan).toLowerCase(); if (nm) prog = (DB.program || []).find(p => String(p.subkegiatan || '').toLowerCase() === nm); }
      const keperluan = rampungKeperluanSPT(s);
      const kegiatan = prog
        ? { subkegiatanId: prog.id, kodeOrganisasi: prog.kodeOrganisasi||'', kodeProgram: prog.kodeProgram||'', program: prog.program||'', kodeKegiatan: prog.kodeKegiatan||'', kegiatan: prog.kegiatan||'', kodeSubkegiatan: prog.kodeSubkegiatan||'', subkegiatan: prog.subkegiatan||'', rekening: prog.rekening||'', rekeningUraian: prog.rekeningUraian||'', keperluan: keperluan }
        : { subkegiatanId:'', kodeOrganisasi:'', kodeProgram:'', program:'', kodeKegiatan:'', kegiatan:'', kodeSubkegiatan:'', subkegiatan: (s.kegiatan&&s.kegiatan.subkegiatan) || '', rekening:'', rekeningUraian:'', keperluan: keperluan };
      const rincian = (s.pelaksana || []).map(p => ({
        noSpd: s.noSppd||'-', nama: p.nama||'-', nip: p.nip||'-', jabatan: p.jabatan||'', golongan: p.golongan||'', unit: p.unit||'',
        tglSpd: now, jumlahHari: s.lamaHari||1, uangHarian: (s.biaya&&s.biaya.uangHarian)||0, transport: (s.biaya&&s.biaya.transport)||0,
        taksi: (s.biaya&&s.biaya.taksi)||0, penginapan: (s.biaya&&s.biaya.penginapan)||0, sewaKendaraan: (s.biaya&&s.biaya.sewaKendaraan)||0,
        representasi: (s.biaya&&s.biaya.representasi)||0, lainnya: (s.biaya&&s.biaya.lainnya)||0, komponen: []
      }));
      const totalSPPD = (typeof s.total === 'number') ? s.total : calcBiaya(s.biaya || {});
      return {
        id: null, sppdId: s.id, noSppd: s.noSppd||'-', noSpt: s.noSpt||'', nama: pel.nama||'-', nip: pel.nip||'-', jabatan: pel.jabatan||'-',
        tujuan: s.kotaTujuan||'-', maksud: keperluan, tglBerangkat: now||'', tglKembali: s.tglKembali||'', totalSPPD: totalSPPD,
        lamaHari: Number(s.lamaHari) || hitungLamaHari(s.tglBerangkat, s.tglKembali),
        kegiatan, pejabat: { pa:'', pptk: s.pptk||'', bendahara:'' }, rincian,
        tahunAnggaran: (s.kegiatan&&s.kegiatan.tahunAnggaran) || '', totalRincian: rincian.reduce((a,p)=>a+rincianTotal(p),0),
        bukti: s.dokumen ? { tiket:s.dokumen.tiket||null, boarding:s.dokumen.boarding||null, hotel:s.dokumen.hotel||null, transport:s.dokumen.transport||null, lainnya:s.dokumen.pendukung||null } : {},
        status: 'Draf'
      };
    }
    window.openSppdPicker = openSppdPicker;

        const obj = {

          tujuan: d.tujuan || '-', maksud: kegiatan.keperluan,

        btnSave.disabled = true; btnSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

    function renderShPickList(keyword) {

    function shPickFilter() { renderShPickList($('#shPickSearch') ? $('#shPickSearch').value : ''); }
    function pickRmpStandar(id, key) { pickRmpStandarAll(id, key); }
    function pickRmpStandarAll(id, onlyKey) {
      const s = (DB.standarHarga || []).find(x => x.id === id); if (!s) return;
      const items = window._shPickItems || [
        ['Uang Harian', 'uangHarian'], ['Uang Harian Diklat', 'uangHarianDiklat'],
        ['Uang Representasi', 'uangRepresentasi'], ['Penginapan', 'penginapan'],
        ['Uang Transport', 'uangTransport'], ['Taksi Setempat', 'taksiSetempat'],
        ['Taksi Tanjung/Bill', 'taksiTanjungBill'], ['Biaya Kontribusi', 'biayaKontribusi']
      ];
      const picked = items.filter(([, k]) => !onlyKey || k === onlyKey).filter(([, k]) => Number(s[k]) > 0);
      if (!picked.length) { toast('error', 'Kosong', 'Standar harga daerah ini tidak memiliki nominal.'); return; }
      const satuanMap = { uangHarian: 'OH', uangHarianDiklat: 'OH', uangRepresentasi: 'OH', penginapan: 'Malam', uangTransport: 'Kali', taksiSetempat: 'Kali', taksiTanjungBill: 'Kali', biayaKontribusi: 'Kali' };
      const rillMap = { taksiSetempat: true, taksiTanjungBill: true };
      syncKomponenFromDOM();
      const fresh = picked.map(([label, k]) => ({ deskripsi: (label || '').replace('/', ' ').trim(), harga: Number(s[k]) || 0, qty: 1, satuan: satuanMap[k] || 'OH', persen: 100, rill: !!rillMap[k] }));
      const curEmpty = window.rmpKomponen.length === 1 && !window.rmpKomponen[0].deskripsi && !Number(window.rmpKomponen[0].harga);
      window.rmpKomponen = curEmpty ? fresh : window.rmpKomponen.concat(fresh);
      closeModal('modalRmpStandar');
      setTimeout(renderKomponen, 150);
      toast('success', 'Standar harga dimuat', s.daerahTujuan + ' · ' + fresh.length + ' komponen');
    }
    function rmpKomponenRecalc() {
      let total = 0;
      $$('#komponenRows .komp-row').forEach(row => {
        const hEl = $('.k-harga', row), qEl = $('.k-qty', row), pEl = $('.k-pct', row), sEl = $('.k-sub', row);
        const harga = hEl ? parseRupiahNum(hEl.value) : 0;
        const qty = qEl ? (Number(qEl.value) || 0) : 0;
        let pct = pEl ? parseFloat(pEl.value) : 100; if (isNaN(pct)) pct = 100;
        const sub = harga * qty * (pct / 100);
        if (sEl) sEl.textContent = fmtRupiah(sub);
        total += sub;
      });
      const est = $('#kompEstimasi'); if (est) est.textContent = fmtRupiah(total);
      return total;
    }
    function saveRmpRincian(editIdx) {
      const nama = ($('#riNama').value || '').trim();
      if (!nama) { toast('error', 'Data belum lengkap', 'Nama Pegawai wajib diisi'); return; }
      if (!$('#riNoSpd').value.trim() || !$('#riTglSpd').value) { toast('error', 'Data belum lengkap', 'Nomor SPD dan Tanggal SPD wajib diisi'); return; }
      const komponen = [];
      let estimasi = 0;
      $$('#komponenRows .komp-row').forEach(row => {
        const desk = $('.k-desc', row).value.trim();
        const harga = parseRupiahNum($('.k-harga', row).value);
        const qty = Number($('.k-qty', row).value) || 0;
        let pct = parseFloat($('.k-pct', row).value); if (isNaN(pct)) pct = 100;
        const satuan = $('.k-satuan', row).value.trim() || RMP_SATUAN[0];
        const subtotal = harga * qty * (pct / 100);
        if (!desk && !harga && !qty) return;
        if (!desk) { toast('error', 'Deskripsi kosong', 'Setiap baris item wajib diisi Deskripsi / Komponen'); komponen.length = 0; estimasi = -1; return; }
        komponen.push({ deskripsi: desk, harga, qty, satuan, persen: pct, rill: $('.k-rill', row).checked, subtotal });
        estimasi += subtotal;
      });
      if (estimasi === -1) return;
      if (!komponen.length) { toast('error', 'Komponen kosong', 'Tambahkan minimal satu komponen biaya'); return; }
      const p = { nama, nip: $('#riNip').value, jabatan: $('#riJabatan').value, noSpd: $('#riNoSpd').value.trim(), tglSpd: $('#riTglSpd').value, komponen, total: estimasi };
      if (editIdx != null) window.rmpRincian[editIdx] = p; else window.rmpRincian.push(p);
      renderRmpRincian();
      toast('success', editIdx != null ? 'Rincian diperbarui' : 'Rincian ditambahkan', p.nama);
      closeModal('modalRmpRincian');
    }

    function accordionSection({ id, title, subtitle, icon, body }) {
      const open = !!pengAccState[id];
      return `
  <div class="acc-card ${open ? 'open' : ''}" id="acc-${id}">
    <button type="button" class="acc-head" data-acc-toggle="${id}" aria-expanded="${open ? 'true' : 'false'}" aria-controls="accbody-${id}">
      <span class="acc-ico"><i class="fas ${icon}"></i></span>
      <span class="acc-text">
        <span class="acc-title">${escapeHtml(title)}</span>
        <span class="acc-sub">${escapeHtml(subtitle)}</span>
      </span>
      <span class="acc-chev"><i class="fas fa-chevron-down"></i></span>
    </button>
    <div class="acc-body" id="accbody-${id}"${open ? ' style="max-height:none"' : ''}>
      <div class="acc-inner">${body}</div>
    </div>
  </div>`;
    }
    function bindAccordions(rootSel) {
      $$(`${rootSel} [data-acc-toggle]`).forEach(head => {
        head.addEventListener('click', () => toggleAccordion(head.dataset.accToggle));
      });
    }
    function toggleAccordion(id) {
      const card = document.getElementById('acc-' + id);
      if (!card) return;
      const body = card.querySelector('.acc-body');
      const head = card.querySelector('.acc-head');
      if (card.classList.contains('open')) {
        body.style.maxHeight = body.scrollHeight + 'px';
        requestAnimationFrame(() => {
          body.style.maxHeight = '0px';
          card.classList.remove('open');
          head.setAttribute('aria-expanded', 'false');
        });
        pengAccState[id] = false;
      } else {
        card.classList.add('open');
        head.setAttribute('aria-expanded', 'true');
        body.style.maxHeight = body.scrollHeight + 'px';
        setTimeout(() => { if (card.classList.contains('open')) body.style.maxHeight = 'none'; }, 380);
        pengAccState[id] = true;
      }
    }

    let _logoImageCache_ = { fileId: '', dataUrl: '' };
    let _logoImageInflight_ = null;
    async function getLogoImage() {
      const key = String((DB.instansi && DB.instansi.logo) || '').trim();
      if (!gasAvailable() || !key || /^data:image\//i.test(key)) {
        return { fileId: key, dataUrl: /^data:image\//i.test(key) ? key : '' };
      }
      if (_logoImageCache_.fileId === key && _logoImageCache_.dataUrl) return _logoImageCache_;
      if (_logoImageInflight_) return _logoImageInflight_;
      _logoImageInflight_ = (async () => {
        try {
          const res = await gasRequest('getLogoImage', gasGetToken());
          if (res && res.fileId) _logoImageCache_ = { fileId: res.fileId, dataUrl: res.dataUrl || '' };
          return res || { fileId: '', dataUrl: '' };
        } finally {
          _logoImageInflight_ = null;
        }
      })();
      return _logoImageInflight_;
    }
    function logoSrc_(notify) {
      const v = String((DB.instansi && DB.instansi.logo) || '').trim();
      if (!v) return '';
      if (/^data:image\//i.test(v)) return v;
      if (_logoImageCache_.fileId === v) return _logoImageCache_.dataUrl || '';
      if (notify !== false) getLogoImage().then(() => renderKopLogo()).catch(() => {});
      return '';
    }
    function renderKopLogo() {
      const box = $('#kopLogoPreview');
      if (!box) return;
      const src = logoSrc_(true);
      box.innerHTML = src
        ? `<img src="${escapeHtml(src)}" style="width:100%;height:100%;object-fit:contain;border-radius:12px" alt="logo">`
        : '<i class="fas fa-landmark"></i>';
    }
    function paintLogoPreview_(src) {
      const box = $('#kopLogoPreview');
      if (!box) return;
      box.innerHTML = `<img src="${escapeHtml(src)}" style="width:100%;height:100%;object-fit:contain;border-radius:12px" alt="logo">`;
    }
    function attachLogo() {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/png,image/jpeg';
      inp.onchange = async () => {
        const f = inp.files && inp.files[0]; if (!f) return;
        if (!/^image\/(png|jpe?g)$/i.test(f.type || '')) {
          toast('error', 'Format logo tidak didukung', 'Gunakan berkas PNG atau JPG.');
          return;
        }
        if (f.size > 2 * 1024 * 1024) {
          toast('error', 'Logo terlalu besar', 'Ukuran maksimal 2 MB.');
          return;
        }
        let dataUrl = '';
        try {
          dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error('Tidak dapat membaca berkas.'));
            reader.readAsDataURL(f);
          });
        } catch (e) {
          toast('error', 'Gagal membaca berkas', (e && e.message) || '');
          return;
        }
        paintLogoPreview_(dataUrl);
        if (!gasAvailable()) {
          DB.instansi = DB.instansi || {};
          DB.instansi.logo = dataUrl; saveDB();
          renderKopLogo();
          toast('success', 'Logo diperbarui', f.name + ' (tersimpan lokal — hubungkan database agar tersimpan permanen).');
          return;
        }
        try {
          const b64 = String(dataUrl).split(',')[1] || '';
          const saved = await gasRequest('uploadLogoBytes', gasGetToken(), { name: f.name, mimeType: f.type, data: b64 });
          if (!saved || !saved.fileId) throw new Error('Server tidak mengembalikan ID file logo.');
          DB.instansi = DB.instansi || {};
          DB.instansi.logo = saved.fileId; saveDB();
          _logoImageCache_ = { fileId: saved.fileId, dataUrl: dataUrl };
          dataCacheInvalidate_('instansi');
          renderKopLogo();
          toast('success', 'Logo tersimpan', 'Berkas tersimpan di Google Drive dan siap dipakai.');
        } catch (e) {
          renderKopLogo();
          toast('error', 'Upload logo gagal', (e && e.message) || 'Tidak dapat menyimpan ke Google Drive.');
        }
      };
      inp.click();
    }

    const SESSION_KEY = 'siap_sppd_session';
    let SESSION = null;
    let appInitialized = false;

    function loadSession() {
      try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
      catch (e) { return null; }
    }
    function saveSession(s) {
      SESSION = s || null;
      try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }
      catch (e) { }
    }
    function currentSession() { return SESSION; }
    function isAdmin() { return !!(SESSION && SESSION.role === 'admin'); }
    function sessionOwnerId_() { const s = SESSION || {}; return String(s.userId || s.username || s.nip || '').trim(); }
    function recordOwnerId_(r) { return String((r && (r.createdBy || r.createdby)) || '').trim(); }
    function canManageRecord_(r) {
      if (isAdmin()) return true;
      const o = recordOwnerId_(r);
      if (!o) return true;
      return o === sessionOwnerId_();
    }
    function filterOwnedClient_(list) {
      if (isAdmin() || !Array.isArray(list)) return list || [];
      const me = sessionOwnerId_();
      return list.filter(r => { const o = recordOwnerId_(r); return !o || o === me; });
    }
    function sessionRoleLabel() { return ((SESSION && SESSION.role) === 'admin') ? 'Admin' : 'Pengguna'; }
    function initialsOf(nama) {
      const parts = String(nama || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      return (parts[0].charAt(0) + (parts[1] ? parts[1].charAt(0) : '')).toUpperCase();
    }
    function nowStamp() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }

    async function doLogin(username, password) {
      const u = String(username == null ? '' : username).trim();
      const p = String(password == null ? '' : password);
      if (!u || !p) return { ok: false, msg: 'Username dan password wajib diisi.' };

      if (gasAvailable()) {
        try {
          const res = await gasRequest('login', u, p);
          const sess = (res && typeof res === 'object' && res.session) ? res.session : res;
          if (!sess || !sess.token) throw new Error('Respons login server tidak valid.');
          saveSession({
            token: sess.token, userId: sess.userId || null, nama: sess.nama || '',
            username: sess.username || u, nip: sess.nip || '',
            role: sess.role || 'pengguna',
            access: Array.isArray(sess.access) ? sess.access.slice() : [],
            loginAt: sess.loginAt || new Date().toISOString()
          });
          switchUserStore_();
          return { ok: true };
        } catch (err) {
          return { ok: false, msg: (err && err.message) ? err.message : 'Login gagal.' };
        }
      }

      if (u === 'admin' && p === 'admin') {
        const rec = (DB.users || []).find(x => String(x.username || '').toLowerCase() === 'admin') || {};
        saveSession({ userId: rec.id || null, nama: rec.nama || 'Administrator', username: 'admin', nip: rec.nip || '', role: 'admin', access: ['all'], loginAt: new Date().toISOString() });
        if (rec.id) { rec.lastLogin = nowStamp(); saveDB(); }
        switchUserStore_();
        return { ok: true };
      }

      const byNip = (DB.users || []).find(x => String(x.nip || '').trim() === u);
      if (byNip) {
        if (String(byNip.status || 'Aktif') !== 'Aktif') return { ok: false, msg: 'Akun Anda tidak aktif. Hubungi Administrator.' };
        if (String(byNip.nip || '').trim() !== p) return { ok: false, msg: 'Username atau password salah.' };
        saveSession({ userId: byNip.id || null, nama: byNip.nama || '', username: byNip.nip, nip: byNip.nip, role: byNip.role || 'pengguna', access: Array.isArray(byNip.access) ? byNip.access.slice() : [], loginAt: new Date().toISOString() });
        byNip.lastLogin = nowStamp(); saveDB();
        switchUserStore_();
        return { ok: true };
      }

      return { ok: false, msg: 'Username atau password salah.' };
    }

    function applySessionUI() {
      const s = SESSION || {};
      const nama = s.nama || 'Pengguna';
      const av = document.getElementById('chipAvatar'); if (av) av.textContent = initialsOf(nama);
      const cn = document.getElementById('chipNama'); if (cn) cn.textContent = nama;
      const cr = document.getElementById('chipRole'); if (cr) cr.textContent = sessionRoleLabel() + (s.nip ? ' · ' + s.nip : '');
      const tu = document.getElementById('topbarUserName'); if (tu) tu.textContent = nama;
    }

    function cleanupStuckOverlays_() {
      try {
        if (typeof Swal !== 'undefined') {
          Swal.close();
        }
        var swalContainers = document.querySelectorAll('.swal2-container');
        for (var i = 0; i < swalContainers.length; i++) {
          swalContainers[i].remove();
        }
        var backdrops = document.querySelectorAll('.modal-backdrop');
        for (var j = 0; j < backdrops.length; j++) {
          backdrops[j].remove();
        }
        var modals = document.querySelectorAll('.modal.show');
        for (var k = 0; k < modals.length; k++) {
          modals[k].remove();
        }
        document.body.style.overflow = '';
        var fixedElements = document.querySelectorAll('[style*="position: fixed"][style*="z-index"]');
        for (var m = 0; m < fixedElements.length; m++) {
          var style = fixedElements[m].getAttribute('style') || '';
          if (style.indexOf('z-index: 9999') !== -1 || style.indexOf('z-index: 1050') !== -1 ||
              style.indexOf('z-index: 1040') !== -1 || style.indexOf('z-index: 99999') !== -1) {
            fixedElements[m].remove();
          }
        }
      } catch (e) {
      }
    }

    var _idleCheckTimer = null;
    var _lastActivityAt = Date.now();
    var _idleThreshold = 5 * 60 * 1000;
    var _idleRecoveryRan = false;

    function _recordActivity() {
      _lastActivityAt = Date.now();
      _idleRecoveryRan = false;
    }

    function _checkSessionValidity() {
      var sess = SESSION;
      if (!sess) {
        if (!document.body.classList.contains('auth-locked')) {
          showLogin();
        }
        return true;
      }
      if (!sess.token) {
        SESSION = null;
        saveSession(null);
        showLogin();
        toast('info', 'Sesi Berakhir', 'Sesi Anda telah berakhir. Silakan login kembali.');
        return true;
      }
      return false;
    }

    function _runIdleRecovery() {
      try {
        cleanupStuckOverlays_();
        document.body.style.overflow = '';
        _checkSessionValidity();
        var backdrops = document.querySelectorAll('.modal-backdrop');
        if (backdrops.length > 1) {
          for (var i = 1; i < backdrops.length; i++) {
            backdrops[i].remove();
          }
        }
        _idleRecoveryRan = true;
      } catch (e) {
      }
    }

    function _startIdleDetection() {
      if (_idleCheckTimer) return;
      _idleCheckTimer = setInterval(function () {
        var elapsed = Date.now() - _lastActivityAt;
        if (elapsed >= _idleThreshold) {
          _runIdleRecovery();
          _lastActivityAt = Date.now();
        }
      }, 30000);
    }

    function _stopIdleDetection() {
      if (_idleCheckTimer) {
        clearInterval(_idleCheckTimer);
        _idleCheckTimer = null;
      }
    }

    function _setupActivityListeners() {
      var events = ['scroll', 'click', 'mousemove', 'keydown', 'touchstart', 'resize'];
      for (var i = 0; i < events.length; i++) {
        window.addEventListener(events[i], _recordActivity, { passive: true });
      }
    }

    function showLogin() {
      cleanupStuckOverlays_();
      document.body.classList.add('auth-locked');
      document.body.style.overflow = '';
      const err = document.getElementById('loginError'); if (err) { err.style.display = 'none'; err.textContent = ''; }
      const u = document.getElementById('loginUsername'); if (u) u.value = '';
      const p = document.getElementById('loginPassword'); if (p) p.value = '';
      const f = document.getElementById('loginUsername'); if (f && f.focus) { try { f.focus(); } catch (e) { } }
    }
    function hideLogin() { document.body.classList.remove('auth-locked'); }

    async function handleLoginSubmit() {
      const uEl = document.getElementById('loginUsername');
      const pEl = document.getElementById('loginPassword');
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmit');
      const fail = m => { if (errEl) { errEl.textContent = m; errEl.style.display = 'block'; } };
      if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...'; }
      try {
        await delay(250);
        const res = await doLogin(uEl ? uEl.value : '', pEl ? pEl.value : '');
        if (!res || !res.ok) { fail((res && res.msg) || 'Login gagal.'); if (pEl) pEl.value = ''; return; }
        enterApp();
      } catch (e) {
        fail('Terjadi kesalahan: ' + ((e && e.message) ? e.message : e));
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Masuk'; }
      }
    }

    function doLogout() {
      if (gasAvailable() && SESSION && SESSION.token) {
        try { gasRequest('logout', SESSION.token).catch(() => { }); } catch (e) { }
      }
      try { saveDB(); } catch (e) {}
      try { dataCacheInvalidateAll_(); } catch (e) {}
      saveSession(null);
      showLogin();
      toast('info', 'Logout', 'Anda telah keluar dari aplikasi.');
    }

    function enterApp() {
      cleanupStuckOverlays_();
      hideLogin();
      applySessionUI();
      applyMenuAccess();
      if (!appInitialized) { appInitialized = true; initApp(); }
      else { renderPage(); }
    }

    function bootApp() {
      SESSION = loadSession();
      if (SESSION) {
        try { applyUserDB_(loadUserDB_(String(SESSION.userId || SESSION.username || SESSION.nip || ''))); } catch (e) {}
      }
      const form = document.getElementById('loginForm');
      if (form) form.addEventListener('submit', e => { e.preventDefault(); handleLoginSubmit(); });
      if (SESSION) enterApp(); else showLogin();
    }

    window.doLogin = doLogin; window.doLogout = doLogout;
    window.currentSession = currentSession; window.isAdmin = isAdmin;

    /* ============================================================
       13. INISIALISASI APLIKASI & PERILAKU GLOBAL
       ============================================================ */
    function initApp() {
      window.addEventListener('hashchange', renderPage);

      _setupActivityListeners();
      _startIdleDetection();

      const sb = $('#sidebar'), tg = $('#sidebarToggler');
      const collapsed = localStorage.getItem('siap_sppd_sidebar') === '1';
      if (collapsed) sb.classList.add('collapsed');
      tg.addEventListener('click', () => {
        if (window.innerWidth <= 991.98) {
          sb.classList.toggle('open');
          $('#sidebarBackdrop').classList.toggle('show', sb.classList.contains('open'));
        } else {
          sb.classList.toggle('collapsed');
          localStorage.setItem('siap_sppd_sidebar', sb.classList.contains('collapsed') ? '1' : '0');
        }
      });
      $('#sidebarBackdrop').addEventListener('click', () => {
        sb.classList.remove('open'); $('#sidebarBackdrop').classList.remove('show');
      });

      $$('#sidebarNav .nav-item').forEach(n => n.addEventListener('click', () => {
        navigate(n.dataset.page);
        if (window.innerWidth <= 991.98) { sb.classList.remove('open'); $('#sidebarBackdrop').classList.remove('show'); }
      }));

      $('#btnNotify').addEventListener('click', () => toast('info', 'Notifikasi', 'Tidak ada notifikasi baru pada tahap simulasi.'));

      $('#btnFullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { });
        else document.exitFullscreen().catch(() => { });
      });


      if (gasAvailable()) {
        prefetchReferenceData_().catch(() => { });
      }
      renderPage();
    }

    window.resetDemoData = function () {
      localStorage.removeItem(DB_KEY);
      location.reload();
    };

    window.refreshData = async function () {
      dataCacheInvalidateAll_();
      try { await ensureDataVersion_(true); } catch (e) { }
      if (typeof renderPage === 'function') {
        try { renderPage(); } catch (e) { console.error(e); }
      }
      if (typeof toast === 'function') {
        toast('info', 'Data diperbarui', 'Data terbaru berhasil dimuat ulang dari server.');
      }
    };

    document.addEventListener('DOMContentLoaded', bootApp);
  </script>
</body>
