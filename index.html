<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAP SPPD — Sistem Administrasi Perjalanan Dinas</title>

  <!-- ============================================================
     SIAP SPPD — Prototype Frontend
     Sistem Administrasi Perjalanan Dinas (SPPD)
     Tahap 1: FRONTEND dengan DATA DUMMY (belum ada backend)
     Struktur sudah dipisah logis (css.html, js.html, components.html,
     dashboard.html, dsb.) siap digabung ke Google Apps Script
     HTML Service. Buka file ini langsung di browser untuk demo.
     ============================================================ -->

  <!-- CDN: Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CDN: Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- CDN: Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CDN: Google Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CDN: Chart.js + SweetAlert2 + Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!--
    Konfigurasi terpusat + transport HTTP (WAJIB dimuat sebelum script inline
    aplikasi, karena dispatcher `gasRequest` di bawah memanggil window.API).
    - config.js : menyimpan backendUrl + preferensi transport (auto/gas/web/demo).
    - api.js    : implementasi fetch() ke Web App GAS + namespace SIAP.
    Ketika disajikan oleh Apps Script (mode legacy), kedua file ini tetap
    aman: `hasGoogleScriptRun()` tetap return true sehingga transport 'gas'
    yang dipakai. Nilai window.APP_CONFIG / window.API hanya dipakai saat
    aplikasi dibuka dari GitHub Pages.
  -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>

  <style>
    /* =============================================================
   CSS — SIAP SPPD
   (Bagian ini disalin ke file css.html untuk integrasi GAS)
   ============================================================= */
    :root {
      --sidebar-w: 264px;
      --sidebar-collapsed: 78px;
      --topbar-h: 66px;
      --primary: #1f5c8b;
      --primary-dark: #17496e;
      --primary-light: #e7f0f8;
      --accent: #0f766e;
      --bg: #f1f4f9;
      --card: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --sidebar-bg: #0f2740;
      --sidebar-text: #c7d6e6;
      --sidebar-active: #1f5c8b;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --info: #0284c7;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(15, 39, 64, .08), 0 4px 14px rgba(15, 39, 64, .06);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px
    }

    ::-webkit-scrollbar-thumb {
      background: #c3ccd8;
      border-radius: 10px;
      border: 2px solid var(--bg)
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a7b3c3
    }

    a {
      text-decoration: none
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-weight: 700;
      color: var(--text)
    }

    .app {
      display: flex;
      min-height: 100vh
    }

    /* ---------- LOGIN ---------- */
    /* Latar halaman Login dibuat CERAH memakai palet terang aplikasi sendiri:
       --bg (#f1f4f9) → --primary-light (#e7f0f8) → #d8e8f6, dengan pendar lembut
       dari gradasi khas aplikasi #2f7dbb → --accent (#0f766e).
       Murni dekoratif: hanya tampilan, tidak menyentuh elemen/fungsi login. */
    #loginScreen {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 12% 14%, rgba(47, 125, 187, .20) 0%, rgba(47, 125, 187, 0) 46%),
        radial-gradient(circle at 88% 86%, rgba(15, 118, 110, .18) 0%, rgba(15, 118, 110, 0) 48%),
        linear-gradient(150deg, #ffffff 0%, var(--primary-light) 52%, #d8e8f6 100%)
    }

    /* Pendar lembut di belakang kartu agar form tetap kontras & mudah dibaca */
    #loginScreen::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(720px, 92vw);
      height: min(720px, 92vw);
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, .09) 0%, rgba(255, 255, 255, 0) 62%)
    }

    body.auth-locked #loginScreen {
      display: flex
    }

    body.auth-locked .app {
      display: none !important
    }

    /* Kartu login memakai bahasa visual card aplikasi (--card, --radius, --shadow) */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 18px 44px rgba(15, 39, 64, .14), 0 2px 6px rgba(15, 39, 64, .08);
      padding: 30px 28px 24px;
      overflow: hidden;
      animation: loginCardIn .45s cubic-bezier(.22, .8, .28, 1) both
    }

    @keyframes loginCardIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.985)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card {
        animation: none
      }
    }

    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px
    }

    /* Logo login = gradasi identik dengan .sidebar-brand .brand-logo & .avatar */
    .login-brand .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #2f7dbb, #0f766e);
      color: #fff;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(31, 92, 139, .30)
    }

    .login-brand b {
      display: block;
      font-size: 17px;
      color: var(--text);
      line-height: 1.2
    }

    .login-brand span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px
    }

    /* Label & input login mengikuti .form-label / .form-control aplikasi */
    .login-card .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 5px
    }

    .login-card .form-control {
      height: 42px;
      padding: 10px 13px;
      font-size: 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background-color: #fff;
      transition: border-color .18s ease, box-shadow .18s ease
    }

    .login-card .form-control::placeholder {
      color: #9aa8b8
    }

    .login-card .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 .2rem rgba(31, 92, 139, .12)
    }

    .login-error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 12.5px;
      margin-bottom: 12px
    }

    /* Tombol Masuk = .btn-primary aplikasi (solid --primary → --primary-dark) */
    .login-card #loginSubmit {
      height: 42px;
      border: 0;
      border-radius: 9px;
      font-weight: 600;
      background: var(--primary);
      box-shadow: 0 4px 12px rgba(31, 92, 139, .35);
      transition: background-color .15s ease, box-shadow .2s ease, transform .15s ease
    }

    .login-card #loginSubmit:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(31, 92, 139, .40)
    }

    .login-card #loginSubmit:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 3px 9px rgba(31, 92, 139, .32)
    }

    .login-card #loginSubmit:focus-visible {
      outline: 0;
      box-shadow: 0 0 0 .2rem rgba(31, 92, 139, .25), 0 8px 18px rgba(31, 92, 139, .40)
    }

    .login-card #loginSubmit:disabled {
      opacity: .85;
      box-shadow: none
    }

    /* Kotak info memakai --primary-light (warna lembut aplikasi) */
    .login-hint {
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px solid #d3e3f2;
      border-radius: 9px;
      background: var(--primary-light);
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.75
    }

    .login-hint code {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--primary);
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 11px
    }

    /* Responsive: nyaman di layar kecil maupun layar pendek */
    @media (max-width: 480px) {
      #loginScreen {
        padding: 20px 14px
      }

      .login-card {
        padding: 24px 20px 20px
      }

      .login-brand .brand-logo {
        width: 42px;
        height: 42px;
        font-size: 18px
      }

      .login-brand b {
        font-size: 16px
      }
    }

    @media (max-height: 660px) {
      #loginScreen {
        align-items: flex-start;
        padding-top: 24px;
        padding-bottom: 24px
      }
    }

    .main-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      transition: width .25s ease;
      z-index: 1040;
      overflow: hidden;
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed)
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      min-height: var(--topbar-h);
      white-space: nowrap;
    }

    .sidebar-brand .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: linear-gradient(135deg, #2f7dbb, #0f766e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 19px;
      flex-shrink: 0;
    }

    .sidebar-brand .brand-text b {
      display: block;
      color: #fff;
      font-size: 15px;
      line-height: 1.15
    }

    .sidebar-brand .brand-text span {
      font-size: 10.5px;
      color: #8fa9c4;
      letter-spacing: .4px
    }

    .sidebar.collapsed .brand-text,
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .nav-text,
    .sidebar.collapsed .nav-badge {
      display: none
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px
    }

    .nav-label {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #7d97b5;
      padding: 14px 10px 6px;
      white-space: nowrap
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10.5px 12px;
      border-radius: 9px;
      color: var(--sidebar-text);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
      margin-bottom: 3px;
      font-weight: 500;
      font-size: 13.5px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .nav-item i {
      width: 20px;
      text-align: center;
      font-size: 15.5px;
      flex-shrink: 0
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .07);
      color: #fff
    }

    .nav-item.active {
      background: var(--sidebar-active);
      color: #fff;
      box-shadow: 0 4px 12px rgba(31, 92, 139, .35)
    }

    .nav-badge {
      margin-left: auto;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px
    }

    .sidebar-footer {
      padding: 14px;
      border-top: 1px solid rgba(255, 255, 255, .08);
      white-space: nowrap
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2f7dbb, #0f766e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0
    }

    .sidebar-footer b {
      color: #fff;
      font-size: 13px;
      display: block;
      line-height: 1.2
    }

    .sidebar-footer span {
      font-size: 11px;
      color: #8fa9c4
    }

    /* ---------- TOPBAR ---------- */
    .topbar {
      height: var(--topbar-h);
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 1030;
    }

    .topbar .toggler {
      background: none;
      border: none;
      font-size: 19px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px
    }

    .topbar .toggler:hover {
      color: var(--primary)
    }


    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 17px;
      position: relative;
      cursor: pointer
    }

    .icon-btn:hover {
      background: var(--bg);
      color: var(--primary)
    }

    .icon-btn .dot {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 8px;
      height: 8px;
      background: var(--danger);
      border-radius: 50%;
      border: 2px solid #fff
    }

    .topbar .divider {
      width: 1px;
      height: 28px;
      background: var(--border);
      margin: 0 6px
    }

    /* ---------- CONTENT ---------- */
    .content {
      flex: 1;
      padding: 24px 26px;
      margin-left: var(--sidebar-w);
      transition: margin .25s ease;
      min-height: 100vh
    }

    .sidebar.collapsed~.content {
      margin-left: var(--sidebar-collapsed)
    }

    /* ---------- BREADCRUMB / PAGE HEADER ---------- */
    .breadcrumb-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .breadcrumb-wrap i {
      font-size: 11px;
      color: #a7b3c3
    }

    .breadcrumb-wrap .crumb {
      color: var(--text-muted)
    }

    .breadcrumb-wrap .crumb.current {
      color: var(--primary);
      font-weight: 600
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 22px
    }

    .page-head h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -.3px
    }

    .page-head p {
      margin: 4px 0 0;
      color: var(--text-muted);
      font-size: 13px
    }

    .page-head .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    /* ---------- BUTTONS ---------- */
    .btn {
      font-weight: 600;
      font-size: 13.5px;
      border-radius: 9px;
      padding: 8.5px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all .15s;
      justify-content: center
    }

    .btn i {
      font-size: 14px
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary)
    }

    .btn-primary:hover,
    .btn-primary:focus {
      background: var(--primary-dark);
      border-color: var(--primary-dark)
    }

    .btn-outline-primary {
      color: var(--primary);
      border-color: #a8c8e0
    }

    .btn-outline-primary:hover,
    .btn-outline-primary:focus {
      background: var(--primary);
      border-color: var(--primary)
    }

    .btn-soft {
      background: var(--primary-light);
      color: var(--primary);
      border: none
    }

    .btn-soft:hover {
      background: #d6e6f5
    }

    .btn-outline-secondary {
      color: var(--text-muted);
      border-color: var(--border)
    }

    .btn-outline-secondary:hover {
      background: var(--bg)
    }

    .btn-sm {
      padding: 5.5px 11px;
      font-size: 12.5px;
      border-radius: 7px
    }

    /* ---------- CARDS ---------- */
    .card {
      border: none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: var(--card);
      margin-bottom: 22px
    }

    .card-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: var(--radius) var(--radius) 0 0 !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap
    }

    .card-header h5 {
      margin: 0;
      font-size: 15.5px;
      font-weight: 700
    }

    .card-body {
      padding: 20px
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0
    }

    /* ---------- STAT CARDS (Dashboard) ---------- */
    .stat-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      transition: transform .15s;
      height: 100%
    }

    .stat-card:hover {
      transform: translateY(-3px)
    }

    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      flex-shrink: 0
    }

    .stat-icon.blue {
      background: #e7f0f8;
      color: #1f5c8b
    }

    .stat-icon.teal {
      background: #e3f3f1;
      color: #0f766e
    }

    .stat-icon.orange {
      background: #fdf1e3;
      color: #d97706
    }

    .stat-icon.red {
      background: #fdeaea;
      color: #dc2626
    }

    .stat-icon.green {
      background: #e7f6ec;
      color: #16a34a
    }

    .stat-info .stat-value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.5px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums
    }

    .stat-info .stat-label {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 3px
    }

    /* ---------- TABLE ---------- */
    .table-card .table-responsive {
      margin: 0
    }

    .table {
      --bs-table-hover-bg: #f6f9fc;
      margin: 0;
      font-size: 13.5px
    }

    .table thead th {
      background: #f8fafc;
      color: #475569;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      vertical-align: middle;
    }

    .table thead th:not(.no-sort) .th-sort {
      font-size: 10px;
      margin-left: 4px;
      color: #c3ccd8
    }

    .table thead th.sort-active {
      color: var(--primary)
    }

    .table tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid #eef2f6;
      vertical-align: middle
    }

    .table tbody tr:last-child td {
      border-bottom: none
    }

    .table tbody tr:hover {
      background: #f6f9fc
    }

    .table .num {
      color: var(--text-muted)
    }

    /* ---------- TABEL: kolom teks panjang wrap proporsional ---------- */
    .table td.cell-wrap {
      white-space: normal !important;
      word-break: break-word;
      min-width: 420px;
      max-width: 640px;
      line-height: 1.55;
    }
    .table td.cell-nowrap {
      white-space: nowrap;
    }
    /* ---------- RAPIDISPLAY: clamp teks panjang + rerata angka ---------- */
    /* Sel teks panjang: batasi 2 baris agar tinggi baris seragam; teks penuh
       tetap tersedia lewat tooltip (title) dan modal Detail.
       white-space normal (bukan pre-line): baris tersimpan (\n) pada data
       membuat teks patah dini dan menyisakan ruang kosong di kolom — di
       tampilan tabel teks mengalir penuh memanfaatkan lebar kolom.
       text-align justify: tiap baris direntangkan sampai tepi kanan sel
       sehingga tidak ada ruang kosong menggantung di ujung baris. */
    .cell-clamp {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
      max-height: 3.1em;
      cursor: help;
      text-align: justify;
      text-justify: inter-word;

      word-break: break-word;
      text-align: left;
      line-height: 1.55;

    /* ---------- INDIKATOR AKTIVITAS DATA (garis progress di atas topbar) ----------
       Berupa garis tipis horizontal di bagian paling atas topbar. Progressnya
       DETERMINATE (bukan animasi berulang): lebar bar diatur dari JS, sehingga
       garis berjalan SATU KALI dari kiri → kanan, tidak pernah kembali ke 0%,
       dan tidak pernah loop selama satu proses pemuatan.
       Modern, ringan, tidak menutupi konten, tidak menghalangi klik
       (pointer-events: none), dan tidak menggeser posisi elemen topbar —
       karena posisinya absolut di dalam topbar (yang sudah `position: sticky`,
       sehingga otomatis menjadi containing block untuk elemen absolut). */
    .topbar-progress {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      background: transparent;
      transition: opacity .22s ease;
      z-index: 5;
      border-radius: 2px
    }

    .topbar-progress.show {
      opacity: 1
    }

    /* Lebar bar (0% → 100%) diatur oleh JS — TANPA animasi CSS berulang,
       sehingga garis hanya bergerak maju satu kali lalu berhenti. */
    .topbar-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,
        var(--primary) 0%,
        var(--accent) 100%);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(31, 92, 139, .45);
      transition: width .2s linear;
      will-change: width
    }

    @media (prefers-reduced-motion: reduce) {
      .topbar-progress { transition: none }
      .topbar-progress-bar { transition-duration: .01ms }
    }

      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px
    }

    .total-box .total-label {
      font-size: 12.5px;
      opacity: .85
    }

    .total-box .total-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.5px
    }

    /* ---------- TABS (Pengaturan) ---------- */
    .nav-tabs {
      border-bottom: 1px solid var(--border)
    }

    .nav-tabs .nav-link {
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13.5px;
      padding: 11px 16px;
      border-radius: 9px 9px 0 0;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .nav-tabs .nav-link i {
      font-size: 13px
    }

    .nav-tabs .nav-link.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
      background: transparent
    }

    /* ---------- ACCORDION / COLLAPSIBLE (Pengaturan) ---------- */
    .acc-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 22px
    }

    .acc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow .2s, border-color .2s
    }

    .acc-card.open {
      border-color: #c5dcee;
      box-shadow: 0 2px 6px rgba(15, 39, 64, .08), 0 10px 26px rgba(15, 39, 64, .07)
    }

    .acc-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: #fff;
      border: none;
      text-align: left;
      cursor: pointer;
      transition: background .15s;
    }

    .acc-head:hover {
      background: #f8fafc
    }

    .acc-head:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -2px
    }

    .acc-card.open .acc-head {
      background: #fbfcfe;
      border-bottom: 1px solid var(--border)
    }

    .acc-ico {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: all .2s;
    }

    .acc-card.open .acc-ico {
      background: var(--primary);
      color: #fff
    }

    .acc-text {
      flex: 1;
      min-width: 0
    }

    .acc-title {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3
    }

    .acc-sub {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px
    }

    .acc-chev {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: transform .3s ease, background .2s, color .2s;
    }

    .acc-head:hover .acc-chev {
      background: #e2e8f0;
      color: var(--primary)
    }

    .acc-card.open .acc-chev {
      transform: rotate(180deg);
      background: var(--primary-light);
      color: var(--primary)
    }

    .acc-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height .32s cubic-bezier(.4, 0, .2, 1)
    }

    .acc-inner {
      padding: 18px 20px 20px
    }

    /* ---------- PANE TOOLBAR (header isi accordion) ---------- */
    .pane-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .pane-hint {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      align-items: flex-start;
      gap: 7px;
      max-width: 560px;
      line-height: 1.5
    }

    .pane-hint i {
      color: var(--primary);
      margin-top: 2px;
      flex-shrink: 0
    }

    .pane-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff
    }

    .pane-box .table-toolbar {
      background: #fbfcfe
    }

    /* ---------- CHIP / BADGE PERAN ---------- */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 20px;
      padding: 3.5px 10px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      margin: 2px 4px 2px 0;
      white-space: nowrap;
    }

    .chip i {
      font-size: 8px
    }

    .chip-teal {
      background: #e3f3f1;
      color: var(--accent)
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      max-width: 290px
    }

    /* ---------- PILL STATUS PEMAKAIAN (Kop SPD / Kwitansi) ---------- */
    .use-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 4.5px 10px;
      border-radius: 20px;
      white-space: nowrap
    }

    .use-pill.on {
      background: #e7f6ec;
      color: #15803d
    }

    .use-pill.off {
      background: #f1f5f9;
      color: #94a3b8
    }

    .use-pill i {
      font-size: 9.5px
    }

    /* ---------- CHECKBOX GROUP (kartu pilihan) ---------- */
    .chk-group {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 4px
    }

    .chk-group.is-invalid-group {
      border-color: var(--danger);
      background: #fef6f6
    }

    .chk-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .chk-title i {
      font-size: 13px
    }

    .chk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px
    }

    .chk-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all .15s;
      margin: 0;
    }

    .chk-card:hover {
      border-color: #a8c8e0;
      background: #fbfcfe
    }

    .chk-card.on {
      border-color: var(--primary);
      background: var(--primary-light)
    }

    .chk-card .form-check-input {
      margin: 1px 0 0;
      flex-shrink: 0;
      cursor: pointer
    }

    .chk-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0
    }

    .chk-text b {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3
    }

    .chk-text small {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4
    }

    /* ---------- VALIDASI INLINE ---------- */
    .fld {
      position: relative
    }

    .fld-help {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.4
    }

    .field-error {
      font-size: 11.5px;
      color: var(--danger);
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 500
    }

    .field-error i {
      font-size: 11px
    }

    .form-control.is-invalid,
    .form-select.is-invalid {
      border-color: var(--danger);
      background-image: none
    }

    .form-control.is-invalid:focus,
    .form-select.is-invalid:focus {
      box-shadow: 0 0 0 .2rem rgba(220, 38, 38, .12)
    }

    /* ---------- SEL TABEL ---------- */
    .actions-cell {
      white-space: nowrap
    }

    .td-wrap {
      display: block;
      white-space: normal;
      line-height: 1.5;
      max-width: 260px
    }

    .td-muted {
      color: var(--text-muted)
    }

    /* ---------- LOGO / FILE DROP ---------- */
    .logo-preview {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #f1f5f9;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 22px
    }

    .file-drop {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #c3ccd8;
      border-radius: 12px;
      padding: 22px;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      background: #fbfcfe
    }

    .file-drop:hover {
      border-color: var(--primary);
      color: var(--primary)
    }

    .file-drop i {
      font-size: 24px;
      margin-right: 10px
    }

    /* ---------- PREVIEW CETAK ---------- */
    .print-preview {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px;
      background: #fff;
      max-width: 760px;
      margin: 0 auto;
      box-shadow: var(--shadow)
    }

    .print-preview .pp-head {
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 2px solid var(--text);
      padding-bottom: 12px;
      margin-bottom: 12px
    }

    .print-preview .pp-logo {
      width: 58px;
      height: 58px;
      border: 1.5px solid var(--text);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--primary);
      flex-shrink: 0
    }

    .print-preview .pp-inst {
      text-align: center;
      flex: 1
    }

    .print-preview .pp-inst b {
      font-size: 14px;
      display: block;
      line-height: 1.4
    }

    .print-preview .pp-inst span {
      font-size: 12px
    }

    .print-preview .pp-title {
      text-align: center;
      font-weight: 800;
      text-decoration: underline;
      margin: 16px 0;
      font-size: 16px
    }

    .print-preview table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px
    }

    .print-preview table td,
    .print-preview table th {
      border: 1px solid #cbd5e1;
      padding: 6px 9px;
      vertical-align: top
    }

    .print-preview .pp-note {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 14px
    }

    .print-preview .pp-sign {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px
    }

    .print-preview .pp-sign .pp-signbox {
      text-align: center;
      font-size: 12.5px
    }

    .print-preview .pp-sign .pp-signbox .gap {
      height: 64px
    }

    /* ---------- KONFIG CETAK ---------- */
    .konfig-list {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .konfig-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #f8fafc;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s
    }

    .konfig-item:hover {
      border-color: var(--primary)
    }

    .konfig-item.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary)
    }

    .konfig-item i {
      width: 16px;
      text-align: center
    }

    /* ---------- MINI LIST (dashboard) ---------- */
    .mini-list .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eef2f6
    }

    .mini-list .list-item:last-child {
      border-bottom: none
    }

    .mini-list .li-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0
    }

    .mini-list .li-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .mini-list .li-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    /* Sakelar ellipsis/clamp pada anak teks: kontainer flex butuh min-width:0 */
    .mini-list .list-item>div.flex-grow-1 {
      min-width: 0
    }

    .chart-wrap {
      position: relative;
      height: 290px
    }

    .chart-wrap.sm {
      height: 220px
    }

    .detail-pane .dp-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px
    }

    .detail-pane .dp-value {
      font-size: 14px;
      font-weight: 600
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 991.98px) {
      .sidebar {
        transform: translateX(-100%);
        width: var(--sidebar-w)
      }

      .sidebar.open {
        transform: translateX(0);
        box-shadow: 0 0 40px rgba(0, 0, 0, .3)
      }

      .content,
      .sidebar.collapsed~.content {
        margin-left: 0
      }

      .topbar-search {
        display: none
      }

      .content {
        padding: 18px 16px
      }
    }

    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 39, 64, .5);
      z-index: 1035;
      display: none
    }

    .sidebar-backdrop.show {
      display: block
    }

    /* ---------- PRINT (cetak dokumen) ---------- */
    @media print {
      /* Sembunyikan total seluruh saudara #printArea (bukan sekadar visibility,
         agar layout aplikasi tidak lagi menghasilkan halaman-halaman kosong) */
      body.printing > *:not(#printArea) {
        display: none !important
      }

      html,
      body {
        height: auto !important;
        overflow: visible !important;
        background: #fff !important
      }

      #printArea {
        display: block !important;
        position: static;
        left: auto;
        top: auto;
        width: 100%;
        margin: 0;
        padding: 0;
        box-shadow: none;
        border: none;
        page-break-after: avoid
      }

      .no-print {
        display: none !important
      }
    }

    .toast-container {
      z-index: 1080
    }

    /* ==========================================================================
       RESPONSIVE — Desktop / Tablet / Mobile
       --------------------------------------------------------------------------
       Menyesuaikan proporsi layout berdasarkan ukuran viewport tanpa mengubah
       identitas visual aplikasi (warna, bentuk, tipografi). Semua aturan di
       bawah hanya menyentuh ukuran, padding, jarak, dan overflow — TIDAK ada
       fitur/fungsi/alur kerja yang diubah.
       ========================================================================== */

    /* -- Cegah horizontal scroll di luar kendali -- */
    html, body {
      overflow-x: hidden;
      max-width: 100%
    }

    /* Tabel & kartu: scroll sentuh yang halus pada tablet/mobile */
    .table-responsive {
      -webkit-overflow-scrolling: touch
    }

    /* -- Desktop kecil / laptop -- */
    @media (max-width: 1199.98px) {
      .content { padding: 22px 20px }
    }

    /* -- Tablet (≤991.98px): sidebar jadi off-canvas, padding menyusut -- */
    @media (max-width: 991.98px) {
      .topbar { padding: 0 16px; gap: 10px }
      .content { padding: 18px 14px }
      .page-head h1 { font-size: 19px }
      .page-head p  { font-size: 12.5px }
      .card-header  { padding: 14px 16px }
      .card-body    { padding: 16px }
      .form-section { padding: 14px 14px }
      .modal-header { padding: 14px 18px }
      .modal-body   { padding: 16px 18px }
      .modal-footer { padding: 12px 18px }
      .acc-head     { padding: 14px 16px; gap: 12px }
      .acc-inner    { padding: 14px 16px 16px }
      .rmp-card     { padding: 14px 16px }
      .rmp-card-head { flex-wrap: wrap }
      /* Modal tinggi tetap (Rincian / Rampung / SPPD) → melar mengikuti layar */
      #modalRmpRincian .modal-dialog,
      #modalRampung .modal-dialog,
      #modalSPPD .modal-dialog {
        height: auto !important;
        max-height: calc(100vh - 32px) !important
      }
      #modalRmpRincian .modal-content,
      #modalRampung .modal-content {
        height: auto !important;
        max-height: calc(100vh - 32px) !important
      }
      /* Tabel Standar Harga: kembali ke layout auto + horizontal scroll */
      #standarHargaTable table {
        table-layout: auto;
        min-width: 1100px
      }
    }

    /* -- Tablet kecil / mobile landscape (≤767.98px) -- */
    @media (max-width: 767.98px) {
      .content { padding: 14px 12px }
      .topbar  { padding: 0 12px; gap: 8px }
      .topbar .icon-btn { width: 36px; height: 36px; font-size: 15px }

      /* Page header: judul di atas, tombol aksi wrap rapi */
      .page-head {
        flex-direction: column;
        align-items: stretch;
        gap: 12px
      }
      .page-head .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px
      }
      .page-head .actions .btn { flex: 1 1 auto }

      /* Toolbar tabel: search & filter menumpuk penuh lebar */
      .table-toolbar { padding: 12px 14px; gap: 8px }
      .search-box    { min-width: 100%; max-width: 100% }
      .filter-select { flex: 1 1 auto; min-width: 140px }

      /* Stat cards: ikon & angka lebih ringkas */
      .stat-card { padding: 14px 16px; gap: 12px }
      .stat-icon { width: 44px; height: 44px; font-size: 18px; border-radius: 11px }
      .stat-info .stat-value { font-size: 20px }

      /* Tombol & form */
      .btn    { padding: 8px 14px; font-size: 13px }
      .btn-sm { padding: 5px 10px; font-size: 12px }
      .form-label { font-size: 12px }
      .form-control, .form-select { font-size: 13px; padding: 8px 10px }
      .form-section { padding: 12px 12px }
      .form-section .section-title { font-size: 11.5px }

      /* Modal */
      .modal-dialog { margin: 8px }
      .modal-dialog.modal-dialog-scrollable { max-height: calc(100vh - 16px) }
      .modal-body   { padding: 14px 16px }
      .modal-header { padding: 12px 16px }
      .modal-footer {
        padding: 10px 16px;
        flex-wrap: wrap;
        gap: 8px
      }
      .modal-footer .btn { flex: 1 1 auto }
      /* Modal Rincian / Rampung tidak lagi kaku tinggi 100vh */
      #modalRmpRincian .modal-dialog,
      #modalRampung .modal-dialog {
        margin: 8px !important;
        max-height: calc(100vh - 16px) !important
      }
      #modalRmpRincian .modal-content,
      #modalRampung .modal-content {
        max-height: calc(100vh - 16px) !important
      }

      /* Detail pane & tabel kecil */
      .detail-pane .dp-value { font-size: 13px }
      .pagination-wrap { padding: 12px 14px }
      .pagination-info { font-size: 12px }

      /* Tabel komponen Rincian Biaya Pegawai */
      .komp-table thead th { font-size: 9.5px; padding: 2px 4px 6px }
      .komp-table .form-control-sm { font-size: 12px; padding: 6px 8px }
      .komp-total-val { font-size: 18px }

      /* Kotak total & accordion */
      .total-box { padding: 14px 16px }
      .total-box .total-value { font-size: 20px }
      .acc-title { font-size: 14px }
      .acc-sub   { font-size: 11.5px }

      /* Swal print picker: satu kolom di layar sempit */
      .rmp-print-opt-wrap { grid-template-columns: 1fr !important }

      /* Login card */
      .login-card { padding: 24px 20px 20px }
    }

    /* -- Ponsel (≤575.98px) -- */
    @media (max-width: 575.98px) {
      .content { padding: 12px 10px }
      .topbar  { padding: 0 10px }
      .topbar-right { gap: 2px }
      .topbar .divider { display: none }
      .icon-btn { width: 34px; height: 34px }
      .page-head h1 { font-size: 17px }
      .page-head p  { font-size: 12px }
      .card-header h5 { font-size: 14px }

      /* Tabel: baris lebih rapat, font kecil */
      .table thead th { font-size: 10px; padding: 10px 8px }
      .table tbody td { padding: 10px 8px; font-size: 12.5px }

      /* Dropdown lebih ringkas */
      .dropdown-menu { min-width: 170px }

      /* Modal & tombol */
      .modal-dialog { margin: 4px }
      .modal-content { border-radius: 12px }
      .modal-header { padding: 10px 14px }
      .modal-title  { font-size: 15px }
      .modal-body   { padding: 12px 14px }
      .modal-footer { padding: 10px 14px }
      .btn { padding: 8px 12px; font-size: 12.5px }

      /* Checkbox group satu kolom */
      .chk-grid { grid-template-columns: 1fr }

      /* Kartu rincian pegawai */
      .rmp-card { padding: 12px 12px }
      .rmp-card-title { font-size: 14px }
      .btn-outline-pill { padding: 6px 10px; font-size: 12px }
    }

    /* -- Layar sangat pendek (mis. HP landscape) -- */
    @media (max-height: 560px) and (max-width: 991.98px) {
      .modal-dialog { margin: 4px }
      .modal-dialog.modal-dialog-scrollable { max-height: calc(100vh - 8px) }
    }
  </style>
</head>

  <script>
    /* ============================================================
       JS — SIAP SPPD (Prototype Frontend)
       (Bagian ini disalin ke file js.html untuk integrasi GAS)
       ============================================================ */
    'use strict';

    /* ------------------------------------------------------------
       0. UTILITAS DASAR (reusable)
       ------------------------------------------------------------ */
    const $ = (sel, ctx = document) => ctx.querySelector(sel);
    const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

    function fmtRupiah(val) { return 'Rp ' + (Number(val) || 0).toLocaleString('id-ID'); }
    function parseNum(str) {
      if (typeof str === 'number') return isNaN(str) ? 0 : str;
      if (str == null || str === '') return 0;
      let s = String(str).trim().replace(/Rp/gi, '');
      s = s.replace(/[\s\u00A0\u202F\u2007]/g, '');
      s = s.replace(/[\u2024\u2219\u00B7\uFF0E]/g, '.');
      if (!s) return 0;

      const grouped = s.replace(/[^\d.,]/g, '');
      if (/^\d{1,3}([.]\d{3})+$/.test(grouped) || /^\d{1,3}([,]\d{3})+$/.test(grouped)) {
        const n = Number(grouped.replace(/[.,]/g, ''));
        return isNaN(n) ? 0 : n;
      }
      if (/^\d{1,3}([.]\d{3})+,\d{1,2}$/.test(grouped)) {
        const n = Number(grouped.replace(/\./g, '').replace(',', '.'));
        return isNaN(n) ? 0 : n;
      }
      if (/^\d{1,3}([,]\d{3})+\.\d{1,2}$/.test(grouped)) {
        const n = Number(grouped.replace(/,/g, ''));
        return isNaN(n) ? 0 : n;
      }

      if (s.includes('.') && s.includes(',')) {
        if (s.lastIndexOf(',') > s.lastIndexOf('.')) {
          s = s.replace(/\./g, '').replace(',', '.');
        } else {
          s = s.replace(/,/g, '');
        }
      } else if (s.includes('.')) {
        const parts = s.split('.');
        if (parts.length > 2 || (parts[1] && parts[1].length === 3)) {
          s = s.replace(/\./g, '');
        }
      } else if (s.includes(',')) {
        const parts = s.split(',');
        if (parts.length > 2 || (parts[1] && parts[1].length === 3)) {
          s = s.replace(/,/g, '');
        } else {
          s = s.replace(/,/g, '.');
        }
      }
      s = s.replace(/[^\d.-]/g, '');
      const n = Number(s);
      return isNaN(n) ? 0 : n;
    }

    function fmtDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso + (String(iso).length === 10 ? 'T00:00:00' : ''));
      if (isNaN(d)) return iso;
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
    }
    function fmtDateShort(iso) {
      if (!iso) return '-';
      const d = new Date(iso + (String(iso).length === 10 ? 'T00:00:00' : ''));
      if (isNaN(d)) return iso;
      return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function fmtDateTime(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function uid(prefix) { return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
    function debounce(fn, ms) { let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms || 250); }; }

    const STATUS_STYLE = {
      'Belum Rampung': 'badge-belum', 'Draft': 'badge-draft', 'Draf': 'badge-draft',
      'Diajukan': 'badge-diajukan', 'Verifikasi': 'badge-pending', 'Diverifikasi': 'badge-verified',
      'Selesai': 'badge-selesai', 'Aktif': 'badge-active', 'Nonaktif': 'badge-inactive',
      'Dibatalkan': 'badge-cancel'
    };
    const STATUS_ICON = {
      'Belum Rampung': 'fa-circle', 'Draft': 'fa-pen', 'Draf': 'fa-pen', 'Diajukan': 'fa-paper-plane',
      'Verifikasi': 'fa-clock', 'Diverifikasi': 'fa-circle-check', 'Selesai': 'fa-check-double',
      'Aktif': 'fa-circle', 'Nonaktif': 'fa-toggle-off', 'Dibatalkan': 'fa-ban'
    };
    const RAMPUNG_STATUSES = ['Belum Rampung', 'Draf', 'Diajukan', 'Diverifikasi', 'Selesai'];

    function badgeHTML(status) {
      const cls = STATUS_STYLE[status] || 'badge-draft';
      const ic = STATUS_ICON[status] || 'fa-circle';
      return `<span class="badge ${cls} badge-status"><i class="fas ${ic}"></i>${escapeHtml(status)}</span>`;
    }

    function toast(type = 'success', title = 'Sukses', msg = '') {
      const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
      const colors = { success: '#16a34a', error: '#dc2626', warning: '#d97706', info: '#1f5c8b' };
      const el = document.createElement('div');
      el.className = 'toast align-items-center border-0 shadow show';
      el.style.cssText = 'color:#fff;opacity:.98;border-radius:11px;background:' + colors[type] + ';margin-bottom:10px;';
      el.innerHTML = `<div class="d-flex"><div class="toast-body" style="font-size:13.5px;font-weight:500;padding:11px 14px">
    <i class="fas ${icons[type]} me-2"></i>${escapeHtml(title)}${msg ? ' — ' + escapeHtml(msg) : ''}</div>
    <button type="button" class="btn-close btn-close-white me-2 m-auto" style="font-size:10px"
      onclick="this.closest('.toast').remove()"></button></div>`;
      $('#toastContainer').appendChild(el);
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3800);
    }

    async function confirmDialog({ title = 'Konfirmasi', text = 'Apakah Anda yakin ingin melanjutkan?', confirmText = 'Ya, Lanjutkan', icon = 'warning', danger = false } = {}) {
      const res = await Swal.fire({
        title, html: text, icon, showCancelButton: true,
        confirmButtonText: confirmText, cancelButtonText: 'Batal',
        confirmButtonColor: danger ? '#dc2626' : '#1f5c8b',
        cancelButtonColor: '#94a3b8', reverseButtons: true,
        customClass: { popup: 'swal-pop' }
      });
      $$('.swal-pop').forEach(e => e.style.borderRadius = '16px');
      return res.isConfirmed;
    }

    function loadingState() { return `<div class="loading-state"><div class="spinner-border"></div><p class="mt-2 text-muted" style="font-size:13px">Memuat data...</p></div>`; }
    function emptyState(icon = 'fa-folder-open', title = 'Data tidak ditemukan', sub = 'Belum ada data yang cocok dengan pencarian / filter Anda.') {
      return `<div class="empty-state"><i class="fas ${icon}"></i><b>${escapeHtml(title)}</b><p>${escapeHtml(sub)}</p></div>`;
    }

    /* ------------------------------------------------------------
       1. MODAL HELPER (reusable)
       ------------------------------------------------------------ */
    function openModal({ id, title = '', icon = 'fa-file-lines', size = '', body = '', footer = '', onShown = null }) {
      const old = document.getElementById(id);
      if (old) old.remove();
      const sizeCls = size === 'lg' ? 'modal-lg' : size === 'xl' ? 'modal-xl' : size === 'sm' ? 'modal-sm' : '';
      const modal = document.createElement('div');
      modal.className = 'modal fade'; modal.id = id; modal.tabIndex = '-1';
      modal.innerHTML = `
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable ${sizeCls}">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fas ${icon} me-2" style="color:var(--primary)"></i>${escapeHtml(title)}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body">${body}</div>
        ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
      </div>
    </div>`;
      $('#modalContainer').appendChild(modal);
      const bs = new bootstrap.Modal(modal);
      modal.addEventListener('shown.bs.modal', () => onShown && onShown(modal));
      modal.addEventListener('hidden.bs.modal', () => modal.remove());
      bs.show();
      return modal;
    }
    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) { const m = bootstrap.Modal.getInstance(el); if (m) m.hide(); }
    }
    function modalFooter(label, icon) {
      return `<button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"><i class="fas fa-xmark"></i> Batal</button>
    <button type="button" class="btn btn-primary" data-save-modal><i class="fas ${icon || 'fa-floppy-disk'}"></i> ${escapeHtml(label)}</button>`;
    }

    /* ------------------------------------------------------------
       2. KOMPONEN TABEL REUSABLE
       ------------------------------------------------------------ */
    class DataTable {
      constructor({ el, columns, data, pageSize = 8, searchable = true, filters = null, emptyTitle = 'Data tidak ditemukan', onAction = null, actionHTML = null }) {
        this.el = el;
        this.columns = columns;
        this.data = data || [];
        this.pageSize = pageSize;
        this.searchable = searchable;
        this.filters = filters;
        this.emptyTitle = emptyTitle;
        this._onAction = onAction;
        this._actionHTML = actionHTML;
        this.term = ''; this.page = 1; this.sortKey = null; this.sortDir = 1; this.filter = {};
        this.render();
      }
      _filtered() {
        let rows = this.data.slice();
        const t = (this.term || '').toLowerCase().trim();
        if (t) {
          rows = rows.filter(r => {
            const hay = this.columns.map(c => {
              if (c.searchValue) { try { return c.searchValue(r); } catch (e) { return ''; } }
              const v = r[c.searchKey || c.key];
              return (v == null ? '' : v);
            }).join(' | ').toLowerCase();
            return hay.includes(t);
          });
        }
        for (const k of Object.keys(this.filter)) {
          if (this.filter[k] && this.filter[k] !== 'all') rows = rows.filter(r => String(r[k]) === String(this.filter[k]));
        }
        return rows;
      }
      _sorted(rows) {
        if (!this.sortKey) return rows;
        const col = this.columns.find(c => c.key === this.sortKey);
        const dir = this.sortDir;
        return rows.slice().sort((a, b) => {
          let va = a[this.sortKey], vb = b[this.sortKey];
          if (col && col.sortValue) { va = col.sortValue(a); vb = col.sortValue(b); }
          if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
          return String(va == null ? '' : va).localeCompare(String(vb == null ? '' : vb), 'id') * dir;
        });
      }
      _pageCount() { return Math.max(1, Math.ceil(this._sorted(this._filtered()).length / this.pageSize)); }
      changePage(p) { this.page = Math.max(1, p); this.renderRows(); }
      updateData(data, filterOptions) {
        this.data = data || [];
        if (filterOptions) this._refreshFilterOptions(filterOptions);
        this.renderRows();
      }
      _refreshFilterOptions(filterOptions) {
        (this.filters || []).forEach(f => {
          const opts = filterOptions[f.key];
          if (!opts) return;
          const sel = this.el.querySelector('[data-fkey="' + f.key + '"]');
          if (!sel) return;
          const cur = sel.value;
          sel.innerHTML = '<option value="all">' + escapeHtml(f.label || 'Semua') + '</option>' +
            opts.map(o => '<option value="' + escapeHtml(o.value) + '">' + escapeHtml(o.label) + '</option>').join('');
          const stillThere = opts.some(o => String(o.value) === String(cur));
          sel.value = stillThere ? cur : 'all';
          this.filter[f.key] = sel.value === 'all' ? undefined : sel.value;
        });
      }

      render() {
        const fHtml = this.filters ? this.filters.map(f => {
          const opts = (f.options || []).map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('');
          return `<select class="filter-select" data-fkey="${escapeHtml(f.key)}"><option value="all">${escapeHtml(f.label || 'Semua')}</option>${opts}</select>`;
        }).join('') : '';
        let theadH = `<tr><th class="no-sort num" style="width:46px">No</th>`;
        this.columns.forEach(c => {
          const ic = c.key === this.sortKey ? (this.sortDir === 1 ? '<i class="fas fa-sort-up th-sort"></i>' : '<i class="fas fa-sort-down th-sort"></i>') : (c.sortable !== false ? '<i class="fas fa-sort th-sort"></i>' : '');
          const active = c.key === this.sortKey ? 'sort-active' : '';
          const labelHTML = /<\s*br\s*\/?>/i.test(c.label || '') ? c.label : escapeHtml(c.label);
          theadH += `<th data-skey="${escapeHtml(c.key)}" class="${active}" style="${c.width ? 'width:' + c.width + ';' : ''}${c.align ? 'text-align:' + c.align + ';' : ''}">${labelHTML}${ic}</th>`;
        });
        theadH += `<th class="no-sort" style="text-align:center;width:68px">Aksi</th></tr>`;

        this.el.innerHTML = `
      ${(this.searchable || fHtml) ? `<div class="table-toolbar no-print">
          ${this.searchable ? `<div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="Cari..." data-tb-search></div>` : ''}
          ${fHtml}
          <span class="ms-auto badge" style="background:var(--primary-light);color:var(--primary)" data-tb-count></span>
        </div>`: ''}
      <div class="table-responsive">
        <table class="table table-hover align-middle"><thead>${theadH}</thead><tbody data-tb-body></tbody></table>
      </div>
      <div class="pagination-wrap no-print">
        <div class="pagination-info" data-tb-info></div>
        <nav><ul class="pagination" data-tb-pager></ul></nav>
      </div>`;

        if (this.searchable) {
          this.el.querySelector('[data-tb-search]').addEventListener('input', debounce(e => { this.term = e.target.value; this.page = 1; this.renderRows(); }, 200));
        }
        $$('[data-fkey]', this.el).forEach(sel => {
          sel.addEventListener('change', e => { this.filter[sel.dataset.fkey] = e.target.value; this.page = 1; this.renderRows(); });
        });
        this.el.querySelectorAll('th[data-skey]').forEach(th => {
          th.addEventListener('click', () => {
            const k = th.dataset.skey;
            if (this.sortKey === k) this.sortDir *= -1; else { this.sortKey = k; this.sortDir = 1; }
            this.page = 1; this.renderRows();
          });
        });
        this.renderRows();
      }

      renderRows() {
        const rows = this._sorted(this._filtered());
        const pages = Math.max(1, Math.ceil(rows.length / this.pageSize));
        if (this.page > pages) this.page = pages;
        const start = (this.page - 1) * this.pageSize;
        const pageRows = rows.slice(start, start + this.pageSize);
        const body = this.el.querySelector('[data-tb-body]');
        const cnt = this.el.querySelector('[data-tb-count]');
        if (cnt) cnt.textContent = rows.length + ' data';

        if (!rows.length) {
          body.innerHTML = `<tr><td colspan="${this.columns.length + 2}"><div style="padding:6px 0">${emptyState('fa-magnifying-glass', this.emptyTitle, 'Coba ubah kata kunci pencarian atau filter Anda.')}</div></td></tr>`;
        } else {
          body.innerHTML = pageRows.map((r, idx) => {
            let tds = `<td class="num">${start + idx + 1}</td>`;
            this.columns.forEach(c => { tds += `<td${c.tdStyle ? ` style="${c.tdStyle}"` : ''}${c.tdClass ? ` class="${c.tdClass}"` : ''}>${c.render ? c.render(r, idx) : escapeHtml(r[c.key])}</td>`; });
            tds += `<td style="text-align:center" class="actions-cell">${(this._actionHTML || (() => ''))(r)}</td>`;
            return `<tr data-row-id="${escapeHtml(r.id)}">${tds}</tr>`;
          }).join('');
          $$('[data-action]', body).forEach(btn => {
            btn.addEventListener('click', e => {
              e.stopPropagation();
              const row = this.data.find(d => String(d.id) === String(btn.closest('tr').dataset.rowId));
              if (this._onAction) this._onAction(btn.dataset.action, row);
            });
          });
        }
        const pager = this.el.querySelector('[data-tb-pager]');
        const cur = this.page; const seq = [];
        for (let i = 1; i <= pages; i++) {
          if (i === 1 || i === pages || Math.abs(i - cur) <= 2) seq.push(i);
          else if (seq[seq.length - 1] !== '…') seq.push('…');
        }
        let ph = `<li class="page-item ${this.page === 1 ? 'disabled' : ''}"><a class="page-link" data-pg="${this.page - 1}" href="javascript:void(0)"><i class="fas fa-chevron-left" style="font-size:10px"></i></a></li>`;
        seq.forEach(p => {
          ph += p === '…' ? `<li class="page-item disabled"><span class="page-link">…</span></li>`
            : `<li class="page-item ${p === cur ? 'active' : ''}"><a class="page-link" data-pg="${p}" href="javascript:void(0)">${p}</a></li>`;
        });
        ph += `<li class="page-item ${this.page === pages ? 'disabled' : ''}"><a class="page-link" data-pg="${this.page + 1}" href="javascript:void(0)"><i class="fas fa-chevron-right" style="font-size:10px"></i></a></li>`;
        pager.innerHTML = ph;
        $$('[data-pg]', pager).forEach(a => a.addEventListener('click', () => this.changePage(Number(a.dataset.pg))));
        const info = this.el.querySelector('[data-tb-info]');
        if (info) info.textContent = rows.length ? `Menampilkan ${start + 1}–${Math.min(start + this.pageSize, rows.length)} dari ${rows.length} data` : 'Tidak ada data';
      }
    }
    function actionsDropdown(items) {
      return `<span class="actions-menu">
    <button class="act-btn plain" data-bs-toggle="dropdown" data-bs-boundary="viewport" aria-expanded="false" title="Aksi"><i class="fas fa-ellipsis-vertical"></i></button>
    <ul class="dropdown-menu dropdown-menu-end" style="position:absolute">

/* ==========================================================================
 * INDIKATOR AKTIVITAS DATA (garis progress horizontal di atas topbar)
 * --------------------------------------------------------------------------
 * Proses memuat/menyimpan data ditampilkan sebagai GARIS PROGRESS TIPIS di
 * bagian paling atas topbar — bukan overlay layar penuh dan bukan indikator
 * yang mengambang di atas konten. Menu, tabel, tombol, modal, dan seluruh
 * konten tetap dapat dipakai selama data dimuat.
 *
 * CARA KERJA (DETERMINATE — SATU KALI, TIDAK BERULANG):
 *   - Penghitung referensi (ref-count): seluruh permintaan yang berjalan
 *     BERSAMAAN dianggap sebagai SATU proses pemuatan.
 *   - Selama proses berjalan, lebar bar hanya BERTAMBAH maju (asimtotik ke
 *     arah 90%) — tidak pernah kembali ke 0% dan tidak pernah loop.
 *   - Setelah seluruh permintaan selesai, bar diselesaikan sampai 100% lalu
 *     memudar dan menghilang.
 *   - Bar baru boleh mulai lagi HANYA setelah proses sebelumnya benar-benar
 *     selesai dan ada proses pemuatan data yang benar-benar BARU.
 *
 * ANTI-BERKEDIP & ANTI-RESTART:
 *   - Ada jeda tampil singkat: permintaan super cepat tidak memunculkan bar.
 *   - Bila bar sudah tampil, ada durasi tampil minimum sehingga tidak
 *     berkedip-kedip saat proses selesai hampir bersamaan.
 *   - Ada masa tenggang (grace) setelah permintaan terakhir selesai, supaya
 *     rangkaian permintaan BERURUTAN tetap dianggap SATU proses — bukan
 *     restart bar tiap kali request/API berikutnya selesai atau dimulai.
 *
 * PENTING: seluruh fungsi di bawah ini bersifat HISAN (fail-safe). Indikator
 * hanya hiasan — bila setTimeout/document tidak tersedia (mis. lingkungan uji
 * minimal), fungsi tetap tidak boleh melempar error, karena error di sini akan
 * menggagalkan pemuatan data yang sebenarnya.
 * ========================================================================== */
const NET_SHOW_DELAY_ = 90;      /* jeda sebelum bar tampil (anti-kedip) */
const NET_SETTLE_GRACE_ = 140;   /* tenggang setelah request terakhir (batch berurutan) */
const NET_MIN_VISIBLE_ = 280;    /* durasi tampil minimum sekali bar muncul */
const NET_TRICKLE_MS_ = 170;     /* interval langkah maju selama proses */
const NET_TRICKLE_CAP_ = 90;     /* batas maju otomatis sebelum dinyatakan selesai */
const NET_COMPLETE_MS_ = 260;    /* durasi animasi penyelesaian ke 100% */
const NET_FADE_MS_ = 220;        /* durasi memudar setelah mencapai 100% */

let _netCount = 0;               /* jumlah permintaan yang sedang berjalan */
let _netPhase = 'idle';          /* 'idle' | 'showing' | 'finishing' | 'hiding' */
let _netValue = 0;               /* lebar bar saat ini (0..100) */
let _netShownAt = 0;             /* waktu bar mulai tampil */
let _netShowTimer = null;        /* penunda tampil */
let _netTrickleTimer = null;     /* penggerak maju */
let _netFinishTimer = null;      /* tenggang / penyelesaian */
let _netHideTimer = null;        /* pemudaran */
let _netWrap_ = null;            /* elemen pembungkus (#netIndicator) */
let _netBar_ = null;             /* elemen bar (.topbar-progress-bar) */

/** Ambil & simpan referensi elemen indikator (sekali saja). */
function netResolveEls_() {
  if (_netWrap_ && _netBar_) return true;
  if (typeof document === 'undefined' || !document.getElementById) return false;

/** Gambar lebar bar (0..100%). Nilai selalu dijepit agar tidak melewati batas. */
function netPaint_(pct) {

function netStopTrickle_() {

  _netTrickleTimer = null;
}

function netClearFinish_() {

  _netFinishTimer = null;

/** Maju satu langkah: cepat di awal, melambat menjelang batas — selalu monoton naik. */
function netTrickle_() {

/** Tandai proses selesai: hormati durasi tampil minimum, lalu capai 100%. */
function netFinish_() {

function netBegin_() {
  _netCount++;

  netClearFinish_();
  /* Bar sudah tampil untuk proses ini → lanjutkan, JANGAN restart. */
  if (_netPhase === 'showing') return;
  /* Proses sebelumnya sudah selesai (finishing/hiding) → ini proses BARU. */
  if (_netPhase === 'finishing' || _netPhase === 'hiding') netResetState_();

function netEnd_() {
  if (_netCount > 0) _netCount--;

  if (_netShowTimer && typeof clearTimeout === 'function') clearTimeout(_netShowTimer);
  _netShowTimer = null;
  if (_netPhase !== 'showing') return; /* bar belum tampil → tidak ada yang perlu ditutup */
  /* Tunggu sejenak: mungkin ada permintaan lanjutan (batch berurutan). */
  netClearFinish_();
  _netFinishTimer = setTimeout(netFinish_, NET_SETTLE_GRACE_);
}

/* Alias kompatibilitas untuk pemanggilan lama (netShow_/netHide_). */
function netShow_() { if (_netPhase === 'idle') netStartProcess_(); }
function netHide_() { if (_netPhase !== 'idle') netResetState_(); }

function netTrack_(promise) {

 *   'web'   -> fetch() ke Web App GAS (GitHub Pages + backend REST)
 *   'demo'  -> localStorage tiruan (prototype offline; bukan produksi)
 * Prioritas mengikuti API.resolveTransport() yang menghormati override
 * window.APP_CONFIG.transport maupun localStorage['siap_sppd_transport'].
 */
function connectionMode() {
  if (typeof API !== 'undefined' && typeof API.resolveTransport === 'function') {
    return API.resolveTransport();
  }
  return hasGoogleScriptRun() ? 'gas' : 'demo';
}

function connectionModeLabel() {
  var m = connectionMode();
  if (m === 'gas') return 'Google Apps Script (google.script.run)';
  if (m === 'web') return 'GitHub Pages + Web App GAS (REST API)';
  return 'Demo (localStorage, tanpa backend)';
}

/**
 * gasAvailable() dipertahankan untuk kompatibilitas call site lama.
 * Sekarang bernilai true baik pada mode 'gas' maupun 'web', karena keduanya
 * memakai backend nyata. Untuk membedakan, cek connectionMode().
 */
function gasAvailable() {
  var m = connectionMode();
  return m === 'gas' || m === 'web';
}

function gasGetToken() {
  const session = currentSession();
  if (!session || !session.token) {
    SESSION = null; saveSession(null); showLogin();
    throw new Error('Silakan login kembali melalui server.');
  }
  return session.token;
}

/**
 * gasRequest — SATU-SATUNYA corong pemanggilan backend dari UI.
 * Dispatcher: memilih transport berdasarkan connectionMode().
 *   'gas'  -> google.script.run (branch lama, tidak diubah perilakunya)
 *   'web'  -> fetch() ke window.API (assets/js/api.js)
 *   'demo' -> reject dengan pesan jelas (panggilan API tidak tersedia)
 * Bentuk kembali: Promise yang resolve dengan `response.data` (envelope
 * `{success, data, message}` sudah di-unwrap oleh API.call). Semua ±30 call
 * site di file ini TIDAK perlu disunting — signature tetap identik.
 */
function gasRequest(method, ...args) {
  try {
    cleanupStuckOverlays_();
  } catch (e) { }

  var mode = connectionMode();

  if (mode === 'gas') {
    return netTrack_(new Promise((resolve, reject) => {
      var timeoutTimer = setTimeout(function () {
        reject(new Error('Permintaan ke server terlalu lama. Silakan coba kembali.'));
      }, 60000);

      google.script.run
        .withSuccessHandler(function (response) {
          clearTimeout(timeoutTimer);
          if (!response || response.success !== true) {
            reject(new Error((response && response.message) || 'Permintaan backend gagal.'));
            return;
          }
          resolve(response.data);
        })
        .withFailureHandler(function (error) {
          clearTimeout(timeoutTimer);
          reject(new Error(
            (error && error.message) || 'Tidak dapat menghubungi Google Apps Script.'
          ));
        })[method](...args);
    }));
  }

  if (mode === 'web') {
    /* API.call mengembalikan Promise <data> (envelope sudah di-unwrap). */
    return netTrack_(API.call(method, args));
  }

  /* mode 'demo' — tidak ada backend nyata. Call site yang mengharapkan
   * data server akan jatuh ke jalur catch(...) yang sudah tersedia. */
  return Promise.reject(new Error(
    'Belum ada backend aktif. Konfigurasikan URL Web App GAS di '
    + 'assets/js/config.js atau jalankan SIAP.setBackendUrl("<URL>/exec") '
    + 'dari DevTools Console.'
  ));
}

/**
 * Batch: jalankan beberapa aksi dalam SATU round-trip HTTP memakai
 * endpoint `__batch` di WebApp.gs (maks 20 per panggilan — chunking
 * otomatis oleh API.batchAll). Fallback: loop sekuensial untuk mode
 * 'gas' atau bila batch server gagal (mis. salah satu aksi belum
 * masuk whitelist).
 */
async function gasRequestBatch_(calls) {
  const list = (calls || []).filter(Boolean);
  if (!list.length) return [];

  const mode = connectionMode();

  /* Optimalisasi: gunakan __batch server untuk mode 'web' dan > 1 panggilan. */
  if (mode === 'web' && list.length > 1
      && typeof API !== 'undefined'
      && typeof API.batchAll === 'function') {
    try {
      const envs = await netTrack_(API.batchAll(list));
      if (Array.isArray(envs) && envs.length === list.length) return envs;
      /* kalau jumlah respons tidak cocok (kemungkinan besar server lama),
       * jatuh ke loop sekuensial agar aman. */
    } catch (e) {
      /* batch gagal — fallback loop, jangan gagal seluruh operasi. */
    }
  }

  const out = [];
  for (const c of list) {
    try {
      out.push({ success: true, data: await gasRequest(c.action, ...(c.args || [])), message: 'Berhasil.' });
    } catch (e) {
      out.push({ success: false, data: null, message: (e && e.message) || 'Gagal.' });
    }
  }
  return out;
}

async function gasBatchValues_(calls) {
  const env = await gasRequestBatch_(calls);
  return env.map(e => (e && e.success === true) ? e.data : undefined);
}

    const PAGES = ['dashboard', 'sppd', 'rampung', 'program', 'standar-harga', 'pengaturan', 'user'];
    let currentPage = 'dashboard';

    function currentHash() {
      const h = (location.hash || '').replace(/^#\/?/, '').split('/')[0] || 'dashboard';
      return PAGES.includes(h) ? h : 'dashboard';
    }
    function navigate(page) { location.hash = '#/' + page; }

    function canAccess(page) {
      if (!page || page === 'dashboard') return true;
      if (page === 'user') return isAdmin();
      if (isAdmin()) return true;
      const acc = (SESSION && Array.isArray(SESSION.access)) ? SESSION.access : [];
      return acc.includes('all') || acc.includes(page);
    }

    function applyMenuAccess() {
      const nav = document.getElementById('sidebarNav');
      if (nav) {
        nav.querySelectorAll('.nav-item').forEach(n => {
          n.style.display = canAccess(n.dataset.page) ? '' : 'none';
        });
        let label = null, visible = 0;
        Array.from(nav.children).forEach(ch => {
          if (ch.classList.contains('nav-label')) {
            if (label) label.style.display = visible ? '' : 'none';
            label = ch; visible = 0;
          } else if (ch.classList.contains('nav-item')) {
            if (ch.style.display !== 'none') visible++;
          }
        });
        if (label) label.style.display = visible ? '' : 'none';
      }
      const ddUser = document.querySelector('.dropdown-menu a.dropdown-item[href="#/user"]');
      if (ddUser) ddUser.style.display = isAdmin() ? '' : 'none';
      const ddSet = document.querySelector('.dropdown-menu a.dropdown-item[href="#/pengaturan"]');
      if (ddSet) ddSet.style.display = canAccess('pengaturan') ? '' : 'none';

    function setActiveNav() {
      $$('#sidebarNav .nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === currentPage));
      const item = $('#sidebarNav .nav-item[data-page="' + currentPage + '"]');

    }

    let _pageSeq_ = 0;
    function pageSlot_() { return ++_pageSeq_; }
    function slotAlive_(seq) { return seq === _pageSeq_; }

    function setText_(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    }

    function renderPage() {
      currentPage = currentHash();
      if (!canAccess(currentPage)) { navigate('dashboard'); return; }
      const cont = $('#pageContainer');
      cont.innerHTML = `
    <div class="breadcrumb-wrap no-print" id="breadcrumbArea"></div>
    <div id="pageContent"></div>`;
      setActiveNav();
      const loaders = {
        'dashboard': renderDashboard, 'sppd': renderSPPD, 'rampung': renderRampung,
        'program': renderProgram, 'standar-harga': renderStandarHarga,
        'pengaturan': renderPengaturan, 'user': renderUser
      };
      const fn = loaders[currentPage] || renderDashboard;
      const pc = $('#pageContent');
      const pageAtStart = currentPage;
      Promise.resolve(fn()).catch(err => {
        console.error(err);
        if (currentPage !== pageAtStart || !document.contains(pc)) return;
        if (typeof toast === 'function') {
          toast('error', 'Gagal memuat data', (err && err.message) || 'Terjadi kesalahan.');
        }
      });
      window.scrollTo(0, 0);

      try {
        if (currentPage === 'sppd') {

          if (document.getElementById('rampungTable')) fillRampungTable_(DB.rampung || []);

          if (document.getElementById('programTable')) fillProgramTable_(DB.program || []);
        } else if (currentPage === 'standar-harga') {

          if (document.getElementById('dashBody')) {

    let _dashKey_ = null;
    function rampungTotalNilai_(r) {
      if (!r || typeof r !== 'object') return 0;
      let v = r.totalRealisasi;
      if (v === undefined || v === null || v === '') v = r.totalRincian;
      if (v === undefined || v === null || v === '') v = r.totalSPPD;
      if (v !== undefined && v !== null && v !== '') return parseNum(v) || 0;
      if (Array.isArray(r.rincian) && r.rincian.length) {
        try {
          if (typeof rincianTotal === 'function') {
            let s = 0; for (let i = 0; i < r.rincian.length; i++) s += rincianTotal(r.rincian[i]) || 0; return s;
          }
        } catch (e) {}
        return r.rincian.reduce((a, p) => a + (parseNum(p.total) || 0), 0);
      }
      return 0;
    }
    function sigDashboard_(sppd, rampung) {
      const ids = a => (a || []).map(x => (x && x.id) || '').join(',');
      const tot = (rampung || []).reduce((s, x) => s + rampungTotalNilai_(x), 0);
      return (sppd || []).length + '|' + (rampung || []).length + '|' + tot + '|' + ids(sppd) + '|' + ids(rampung);
    }
    function fillDashboard_(sppd, rampung) {
      const now = new Date();
      const bulanIni = sppd.filter(s => { const d = new Date(s.tglBerangkat); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }).length;
      const rampungSelesai = rampung.length;
      const pegUnik = new Set(); sppd.forEach(s => (s.pelaksana || []).forEach(p => pegUnik.add(p.nip)));
      const totalNilai = (rampung || []).reduce((a, r) => a + rampungTotalNilai_(r), 0);
      setText_('dashStatTotalSppd', sppd.length);
      setText_('dashStatBulanIni', bulanIni);
      setText_('dashStatRampung', rampungSelesai);
      setText_('dashStatPegawai', pegUnik.size);
      setText_('dashStatNilai', fmtRupiah(totalNilai));
      const key = sigDashboard_(sppd, rampung);
      if (key === _dashKey_) return;
      _dashKey_ = key;
      renderDashCharts(sppd, rampung, now);
      renderDashActivity(sppd);
      renderDashTable(sppd);
    }
